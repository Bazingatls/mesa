<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JB ESPETO - GESTÃO SEGURA</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes pulse-red {
            0%, 100% { background-color: #991b1b; border-color: #f87171; }
            50% { background-color: #ef4444; border-color: #ffffff; }
        }
        .animate-alert { animation: pulse-red 1.5s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://zpzjpkrglknnhoojglmv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwempwa3JnbGtubmhvb2pnbG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzY4NTUsImV4cCI6MjA5MzA1Mjg1NX0.6BV3CTuBjOXraXnswNBpZoapHF_NDV7P4O1ja_cVNEY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const App = () => {
            const [logado, setLogado] = useState(false);
            const [tentandoLogin, setTentandoLogin] = useState(false);
            const [pagina, setPagina] = useState('home');
            const [mesas, setMesas] = useState(Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' })));
            const [produtos, setProdutos] = useState([]);
            const [notas, setNotas] = useState([]);
            const [idMesaAberta, setIdMesaAberta] = useState(null);
            const [carregando, setCarregando] = useState(true);

            useEffect(() => {
                const sessao = localStorage.getItem('jb_sessao_ativa');
                if (sessao === 'sim') setLogado(true);
                buscarDados();
                const timer = setInterval(buscarDados, 5000);
                return () => clearInterval(timer);
            }, []);

            async function buscarDados() {
                try {
                    const { data: prods } = await supabaseClient.from('produtos').select('*').order('nome');
                    if (prods) setProdutos(prods);

                    const { data: pedidos } = await supabaseClient.from('pedidos').select('*');
                    const novasMesas = Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' }));
                    if (pedidos) {
                        pedidos.forEach(p => {
                            const idx = p.mesa - 1;
                            if (novasMesas[idx]) {
                                novasMesas[idx].itens.push(p);
                                novasMesas[idx].total += p.preco_unidade;
                                if (p.apelido_mesa) novasMesas[idx].apelido = p.apelido_mesa;
                            }
                        });
                    }
                    setMesas(novasMesas);

                    const { data: nts } = await supabaseClient.from('notas_pendentes').select('*').eq('pago', false).order('data', { ascending: false });
                    if (nts) setNotas(nts);
                } catch (err) { console.error(err); }
                setCarregando(false);
            }

            // LOGIN SEGURO VIA BANCO DE DADOS
            const realizarLogin = async (e) => {
                e.preventDefault();
                setTentandoLogin(true);
                const u = e.target.usuario.value;
                const p = e.target.senha.value;

                try {
                    const { data, error } = await supabaseClient
                        .from('usuarios_gestao')
                        .select('usuario, nivel')
                        .eq('usuario', u)
                        .eq('senha', p)
                        .single();

                    if (data) {
                        setLogado(true);
                        localStorage.setItem('jb_sessao_ativa', 'sim');
                    } else {
                        alert("Usuário ou senha inválidos!");
                    }
                } catch (err) {
                    alert("Erro ao validar acesso. Verifique sua conexão.");
                } finally {
                    setTentandoLogin(false);
                }
            };

            // CADASTRO DE PRODUTO
            async function handleNovoProd(e) {
                e.preventDefault();
                const nome = e.target.n.value;
                const preco = parseFloat(e.target.p.value);
                const estoque = parseInt(e.target.e.value);
                await supabaseClient.from('produtos').insert([{ nome, preco, estoque }]);
                e.target.reset();
                buscarDados();
                alert("Produto cadastrado!");
            }

            async function handleExcluirProd(id) {
                if (confirm("Excluir produto permanentemente?")) {
                    await supabaseClient.from('produtos').delete().eq('id', id);
                    buscarDados();
                }
            }

            // FIADOS / NOTAS
            async function pendurarConta() {
                const mesa = mesas.find(m => m.id === idMesaAberta);
                if (mesa.total <= 0) return alert("Mesa vazia!");
                const cliente = prompt("Nome do cliente:", mesa.apelido);
                if (cliente) {
                    await supabaseClient.from('notas_pendentes').insert([{ cliente: cliente.toUpperCase(), valor: mesa.total }]);
                    await supabaseClient.from('pedidos').delete().eq('mesa', idMesaAberta);
                    setIdMesaAberta(null);
                    buscarDados();
                    alert("Conta anotada!");
                }
            }

            async function darBaixaNota(id) {
                if (confirm("Confirmar pagamento?")) {
                    await supabaseClient.from('notas_pendentes').update({ pago: true }).eq('id', id);
                    buscarDados();
                }
            }

            // MESAS E PEDIDOS
            async function handleAddPedido(prod) {
                if (prod.estoque <= 0) return alert("Sem estoque!");
                const mesa = mesas.find(m => m.id === idMesaAberta);
                await supabaseClient.from('pedidos').insert([{ mesa: idMesaAberta, produto_nome: prod.nome, preco_unidade: prod.preco, apelido_mesa: mesa.apelido }]);
                await supabaseClient.from('produtos').update({ estoque: prod.estoque - 1 }).eq('id', prod.id);
                buscarDados();
            }

            if (!logado) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-950 p-6">
                        <form onSubmit={realizarLogin} className="w-full max-w-sm bg-slate-900 p-8 rounded-[40px] border border-slate-800 shadow-2xl">
                            <h1 className="text-4xl font-black text-center text-white mb-2 italic underline decoration-orange-500 underline-offset-8">JB ESPETO</h1>
                            <p className="text-center text-slate-500 text-[10px] uppercase font-black mb-8 tracking-[0.2em]">Acesso Seguro</p>
                            <input name="usuario" placeholder="Usuário" className="w-full p-4 mb-4 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700 focus:border-orange-500" required />
                            <input name="senha" type="password" placeholder="Senha" className="w-full p-4 mb-6 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700 focus:border-orange-500" required />
                            <button disabled={tentandoLogin} className="w-full bg-orange-600 text-white p-4 rounded-2xl font-black uppercase shadow-lg active:scale-95 transition-all">
                                {tentandoLogin ? 'Verificando...' : 'Entrar'}
                            </button>
                        </form>
                    </div>
                );
            }

            if (carregando) return <div className="h-screen flex items-center justify-center text-orange-500 font-black italic">CARREGANDO...</div>;

            const mesaAtual = mesas.find(m => m.id === idMesaAberta);

            return (
                <div className="min-h-screen pb-32">
                    <header className="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
                        <h1 className="font-black italic text-xl">JB <span className="text-orange-500">ESPETO</span></h1>
                        <button onClick={() => {localStorage.removeItem('jb_sessao_ativa'); setLogado(false);}} className="text-[10px] font-black text-red-500 px-3 py-1 bg-red-500/10 rounded-lg">SAIR</button>
                    </header>

                    <main className="p-4">
                        {pagina === 'home' && (
                            <div className="grid grid-cols-2 gap-3">
                                {mesas.map(m => (
                                    <div key={m.id} onClick={() => setIdMesaAberta(m.id)} className={`p-4 rounded-2xl border-2 transition-all ${m.total > 0 ? 'bg-orange-600 border-orange-400' : 'bg-slate-800 border-slate-700 opacity-60'}`}>
                                        <div className="text-[10px] font-black uppercase text-white/70">Mesa {m.id}</div>
                                        <div className="text-xl font-black text-white">R$ {m.total.toFixed(2)}</div>
                                        {m.apelido && <div className="text-[9px] bg-black/30 p-1 mt-1 rounded font-bold uppercase truncate">{m.apelido}</div>}
                                    </div>
                                ))}
                            </div>
                        )}

                        {pagina === 'estoque' && (
                            <div className="space-y-6">
                                <form onSubmit={handleNovoProd} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-3">
                                    <h2 className="text-[11px] font-black text-orange-500 uppercase tracking-[0.2em] mb-2">Novo Produto</h2>
                                    <input name="n" placeholder="Nome do Item" className="w-full p-4 bg-slate-800 rounded-xl outline-none border border-slate-700 text-sm font-bold" required />
                                    <div className="flex gap-2">
                                        <input name="p" type="number" step="0.01" placeholder="Preço" className="flex-1 p-4 bg-slate-800 rounded-xl border border-slate-700 text-sm font-bold" required />
                                        <input name="e" type="number" placeholder="Estoque" className="w-24 p-4 bg-slate-800 rounded-xl border border-slate-700 text-sm font-bold" required />
                                    </div>
                                    <button className="w-full bg-orange-600 p-4 rounded-xl font-black uppercase text-xs">Salvar Produto</button>
                                </form>

                                <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800">
                                    <h2 className="text-[10px] font-black text-slate-500 uppercase mb-4 px-2 tracking-widest">Controle de Cardápio</h2>
                                    {produtos.map(p => (
                                        <div key={p.id} className="flex justify-between items-center py-4 border-b border-slate-800 last:border-0">
                                            <div className="flex-1 pr-2 uppercase font-black text-sm">{p.nome} <br/><span className="text-orange-500 text-[10px]">R$ {p.preco.toFixed(2)}</span></div>
                                            <div className="flex items-center gap-3">
                                                <input type="number" defaultValue={p.estoque} onBlur={async (e) => {
                                                    await supabaseClient.from('produtos').update({ estoque: parseInt(e.target.value) }).eq('id', p.id);
                                                    buscarDados();
                                                }} className={`w-12 p-2 text-center rounded-lg font-black text-xs ${p.estoque <= 5 ? 'animate-alert text-white' : 'bg-slate-800 border border-slate-700 text-slate-300'}`} />
                                                <button onClick={() => handleExcluirProd(p.id)} className="text-red-500/50 p-2 text-lg">🗑️</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {pagina === 'notas' && (
                            <div className="space-y-3">
                                <h2 className="text-2xl font-black italic text-orange-500 uppercase px-2 mb-4">Notas Pendentes</h2>
                                {notas.length === 0 && <p className="text-center py-20 text-slate-600 font-black uppercase italic">Sem pendências!</p>}
                                {notas.map(n => (
                                    <div key={n.id} className="bg-slate-900 border border-slate-800 p-5 rounded-3xl flex justify-between items-center shadow-xl border-l-4 border-l-orange-600">
                                        <div>
                                            <div className="font-black uppercase text-white text-base">{n.cliente}</div>
                                            <div className="text-[10px] font-bold text-slate-500">{new Date(n.data).toLocaleDateString('pt-BR')} às {new Date(n.data).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</div>
                                            <div className="text-orange-500 font-black text-xl mt-1">R$ {n.valor.toFixed(2)}</div>
                                        </div>
                                        <button onClick={() => darBaixaNota(n.id)} className="bg-green-600 text-white px-5 py-3 rounded-2xl font-black text-[10px] uppercase shadow-lg active:scale-95 transition-all">Receber</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-md p-4 border-t border-slate-800 flex gap-2 z-40">
                        <button onClick={() => setPagina('home')} className={`flex-1 py-4 rounded-2xl font-black text-[10px] ${pagina === 'home' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>MESAS</button>
                        <button onClick={() => setPagina('notas')} className={`flex-1 py-4 rounded-2xl font-black text-[10px] relative ${pagina === 'notas' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>
                            NOTAS {notas.length > 0 && <span className="absolute -top-1 -right-1 bg-red-600 text-[8px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-slate-900 animate-bounce">{notas.length}</span>}
                        </button>
                        <button onClick={() => setPagina('estoque')} className={`flex-1 py-4 rounded-2xl font-black text-[10px] ${pagina === 'estoque' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>ESTOQUE</button>
                    </nav>

                    {idMesaAberta && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-sm z-[60] flex items-end">
                            <div className="bg-slate-900 w-full rounded-t-[40px] p-6 border-t border-slate-700 max-h-[95vh] flex flex-col">
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h2 className="text-3xl font-black text-orange-500 uppercase italic">Mesa {idMesaAberta}</h2>
                                        <p className="text-[10px] font-black text-slate-400 uppercase mt-2">{mesaAtual.apelido || 'Sem Apelido'}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={async () => {
                                            const n = prompt("Apelido:");
                                            if(n) { await supabaseClient.from('pedidos').update({ apelido_mesa: n }).eq('mesa', idMesaAberta); buscarDados(); }
                                        }} className="bg-slate-800 text-white px-3 py-2 rounded-xl text-[9px] font-black border border-slate-600 uppercase">🏷️ Nome</button>
                                        <button onClick={() => setIdMesaAberta(null)} className="bg-slate-800 text-white w-10 h-10 rounded-full font-bold">✕</button>
                                    </div>
                                </div>

                                <div className="bg-slate-950 p-5 rounded-3xl mb-6 border border-slate-800">
                                    <div className="max-h-32 overflow-y-auto no-scrollbar mb-4 space-y-2">
                                        {mesaAtual.itens.map((it, i) => (
                                            <div key={i} className="flex justify-between text-[11px] font-bold uppercase text-slate-400">
                                                <span>{it.produto_nome}</span>
                                                <div className="flex gap-4">
                                                    <span>R${it.preco_unidade.toFixed(2)}</span>
                                                    <button onClick={async () => { await supabaseClient.from('pedidos').delete().eq('id', it.id); buscarDados(); }} className="text-red-500 font-black">X</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="text-right text-3xl font-black text-white border-t border-slate-800 pt-3">R$ {mesaAtual.total.toFixed(2)}</div>
                                </div>

                                <div className="flex-1 overflow-y-auto no-scrollbar grid grid-cols-2 gap-2 mb-6">
                                    {produtos.map(p => (
                                        <button key={p.id} onClick={() => handleAddPedido(p)} className="p-4 bg-slate-800 rounded-2xl text-left border border-slate-700 active:scale-95 transition-all">
                                            <div className="text-[10px] font-black text-slate-500 uppercase truncate mb-1">{p.nome}</div>
                                            <div className="font-black text-white text-base">R$ {p.preco.toFixed(2)}</div>
                                            <div className={`text-[8px] font-black mt-2 ${p.estoque <= 5 ? 'text-red-500 animate-pulse' : 'text-slate-500'}`}>EST: {p.estoque}</div>
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={pendurarConta} className="bg-orange-600 p-5 rounded-2xl font-black uppercase text-[11px] shadow-lg">Anotar Fiado</button>
                                    <button onClick={async () => {
                                        if(confirm("Limpar mesa?")) { await supabaseClient.from('pedidos').delete().eq('mesa', idMesaAberta); setIdMesaAberta(null); buscarDados(); }
                                    }} className="bg-red-600 p-5 rounded-2xl font-black uppercase text-[11px] shadow-lg">Limpar Mesa</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
