<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JB ESPETO - GESTÃO OFICIAL</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes pulse-red {
            0%, 100% { background-color: #991b1b; border-color: #f87171; }
            50% { background-color: #ef4444; border-color: #ffffff; }
        }
        .animate-alert { animation: pulse-red 1.5s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://zpzjpkrglknnhoojglmv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwempwa3JnbGtubmhvb2pnbG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzY4NTUsImV4cCI6MjA5MzA1Mjg1NX0.6BV3CTuBjOXraXnswNBpZoapHF_NDV7P4O1ja_cVNEY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const App = () => {
            const [logado, setLogado] = useState(false);
            const [pagina, setPagina] = useState('home');
            const [mesas, setMesas] = useState(Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' })));
            const [produtos, setProdutos] = useState([]);
            const [notas, setNotas] = useState([]);
            const [idMesaAberta, setIdMesaAberta] = useState(null);
            const [carregando, setCarregando] = useState(true);

            const USUARIOS_PERMITIDOS = [
                { user: "teta", pass: "teta" },
                { user: "bruno", pass: "cajado" }
            ];

            useEffect(() => {
                const sessao = localStorage.getItem('jb_sessao_ativa');
                if (sessao === 'sim') setLogado(true);
                buscarDados();
                const timer = setInterval(buscarDados, 5000);
                return () => clearInterval(timer);
            }, []);

            async function buscarDados() {
                try {
                    // Busca Produtos
                    const { data: prods } = await supabaseClient.from('produtos').select('*').order('nome');
                    if (prods) setProdutos(prods);

                    // Busca Pedidos das Mesas
                    const { data: pedidos } = await supabaseClient.from('pedidos').select('*');
                    const novasMesas = Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' }));
                    if (pedidos) {
                        pedidos.forEach(p => {
                            const idx = p.mesa - 1;
                            if (novasMesas[idx]) {
                                novasMesas[idx].itens.push(p);
                                novasMesas[idx].total += p.preco_unidade;
                                if (p.apelido_mesa) novasMesas[idx].apelido = p.apelido_mesa;
                            }
                        });
                    }
                    setMesas(novasMesas);

                    // Busca Notas Pendentes (Fiados)
                    const { data: nts } = await supabaseClient.from('notas_pendentes').select('*').eq('pago', false).order('data', { ascending: false });
                    if (nts) setNotas(nts);
                } catch (err) { console.error("Erro Geral:", err); }
                setCarregando(false);
            }

            const realizarLogin = (e) => {
                e.preventDefault();
                const u = e.target.usuario.value;
                const p = e.target.senha.value;
                if (USUARIOS_PERMITIDOS.find(item => item.user === u && item.pass === p)) {
                    setLogado(true);
                    localStorage.setItem('jb_sessao_ativa', 'sim');
                } else { alert("Usuário ou senha inválidos!"); }
            };

            const realizarSair = () => {
                localStorage.removeItem('jb_sessao_ativa');
                setLogado(false);
            };

            // GERENCIAMENTO DE NOTAS (FIADO)
            async function pendurarConta() {
                const mesa = mesas.find(m => m.id === idMesaAberta);
                if (mesa.total <= 0) return alert("Não há consumo nesta mesa!");
                
                const cliente = prompt("Nome do cliente para salvar na nota:", mesa.apelido);
                if (cliente) {
                    const { error } = await supabaseClient.from('notas_pendentes').insert([{ 
                        cliente: cliente.toUpperCase(), 
                        valor: mesa.total 
                    }]);
                    
                    if (!error) {
                        await supabaseClient.from('pedidos').delete().eq('mesa', idMesaAberta);
                        setIdMesaAberta(null);
                        buscarDados();
                        alert("Nota salva com sucesso!");
                    } else {
                        alert("Erro ao salvar nota. Verifique se a tabela foi criada.");
                    }
                }
            }

            async function darBaixaNota(id) {
                if (confirm("Confirmar que o cliente pagou esta nota?")) {
                    await supabaseClient.from('notas_pendentes').update({ pago: true }).eq('id', id);
                    buscarDados();
                }
            }

            // FUNÇÕES DE MESA
            async function handleApelido() {
                const nome = prompt("Definir apelido para a mesa:");
                if (nome !== null) {
                    await supabaseClient.from('pedidos').update({ apelido_mesa: nome }).eq('mesa', idMesaAberta);
                    buscarDados();
                }
            }

            async function handleAddPedido(prod) {
                if (prod.estoque <= 0) return alert("Produto sem estoque!");
                const mesa = mesas.find(m => m.id === idMesaAberta);
                await supabaseClient.from('pedidos').insert([{ 
                    mesa: idMesaAberta, 
                    produto_nome: prod.nome, 
                    preco_unidade: prod.preco, 
                    apelido_mesa: mesa.apelido 
                }]);
                await supabaseClient.from('produtos').update({ estoque: prod.estoque - 1 }).eq('id', prod.id);
                buscarDados();
            }

            async function handleRemoverItem(id) {
                await supabaseClient.from('pedidos').delete().eq('id', id);
                buscarDados();
            }

            async function handleLimparMesa(id) {
                if (confirm(`Limpar todos os itens da Mesa ${id}?`)) {
                    await supabaseClient.from('pedidos').delete().eq('mesa', id);
                    setIdMesaAberta(null);
                    buscarDados();
                }
            }

            if (!logado) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-950 p-6">
                        <form onSubmit={realizarLogin} className="w-full max-w-sm bg-slate-900 p-8 rounded-[40px] border border-slate-800 shadow-2xl">
                            <h1 className="text-4xl font-black italic text-white text-center mb-8 underline decoration-orange-500 underline-offset-8">JB ESPETO</h1>
                            <div className="space-y-4">
                                <input name="usuario" placeholder="Usuário" className="w-full p-4 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700 font-bold" required />
                                <input name="senha" type="password" placeholder="Senha" className="w-full p-4 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700 font-bold" required />
                                <button className="w-full bg-orange-600 text-white p-4 rounded-2xl font-black uppercase shadow-lg">Entrar</button>
                            </div>
                        </form>
                    </div>
                );
            }

            if (carregando) return <div className="h-screen flex items-center justify-center text-orange-500 font-black italic animate-pulse">CARREGANDO JB ESPETO...</div>;

            const mesaAtual = mesas.find(m => m.id === idMesaAberta);

            return (
                <div className="min-h-screen pb-32">
                    <header className="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
                        <h1 className="font-black italic text-xl">JB <span className="text-orange-500 uppercase">Espeto</span></h1>
                        <button onClick={realizarSair} className="text-[10px] font-black text-red-500 bg-red-500/10 px-3 py-1.5 rounded-lg border border-red-500/20">SAIR</button>
                    </header>

                    <main className="p-4">
                        {pagina === 'home' && (
                            <div className="grid grid-cols-2 gap-3">
                                {mesas.map(m => (
                                    <div key={m.id} onClick={() => setIdMesaAberta(m.id)} className={`p-4 rounded-2xl border-2 transition-all active:scale-95 ${m.total > 0 ? 'bg-orange-600 border-orange-400 shadow-lg' : 'bg-slate-800 border-slate-700 opacity-60'}`}>
                                        <div className="text-[10px] font-black uppercase text-white/70 italic">Mesa {m.id}</div>
                                        <div className="text-xl font-black text-white">R$ {m.total.toFixed(2)}</div>
                                        {m.apelido && <div className="text-[9px] bg-black/30 p-1 mt-1 rounded font-bold uppercase truncate text-center">{m.apelido}</div>}
                                    </div>
                                ))}
                            </div>
                        )}

                        {pagina === 'estoque' && (
                            <div className="space-y-4">
                                <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800 shadow-lg">
                                    <h2 className="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest px-2">Gestão de Itens</h2>
                                    {produtos.map(p => (
                                        <div key={p.id} className="flex justify-between items-center py-4 border-b border-slate-800 last:border-0">
                                            <div className="flex-1 pr-2 uppercase font-black text-sm">
                                                {p.nome} 
                                                <div className="text-orange-500 text-[10px]">R$ {p.preco.toFixed(2)}</div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className="text-[9px] font-bold text-slate-500">ESTOQUE:</span>
                                                <input type="number" defaultValue={p.estoque} onBlur={async (e) => {
                                                    await supabaseClient.from('produtos').update({ estoque: parseInt(e.target.value) }).eq('id', p.id);
                                                    buscarDados();
                                                }} className={`w-14 p-2 text-center rounded-lg font-black text-xs border-2 ${p.estoque <= 5 ? 'animate-alert border-white text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`} />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {pagina === 'notas' && (
                            <div className="space-y-3">
                                <div className="flex justify-between items-end mb-4 px-2">
                                    <h2 className="text-2xl font-black italic text-orange-500 uppercase leading-none">Notas Pendentes</h2>
                                    <span className="text-[10px] font-black bg-slate-800 px-2 py-1 rounded text-slate-400 uppercase">{notas.length} Clientes</span>
                                </div>
                                
                                {notas.length === 0 && (
                                    <div className="bg-slate-900/50 border border-dashed border-slate-800 rounded-3xl p-10 text-center">
                                        <p className="text-slate-600 font-black uppercase italic text-sm">Tudo pago por aqui!</p>
                                    </div>
                                )}
                                
                                {notas.map(n => (
                                    <div key={n.id} className="bg-slate-900 border border-slate-800 p-5 rounded-3xl flex justify-between items-center shadow-xl border-l-4 border-l-yellow-500">
                                        <div className="flex-1">
                                            <div className="font-black uppercase text-white text-base truncate pr-2">{n.cliente}</div>
                                            <div className="text-[9px] font-bold text-slate-500 mt-1 uppercase italic">
                                                📌 {new Date(n.data).toLocaleDateString('pt-BR')} • {new Date(n.data).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}
                                            </div>
                                            <div className="text-orange-500 font-black text-xl mt-1">R$ {n.valor.toFixed(2)}</div>
                                        </div>
                                        <button onClick={() => darBaixaNota(n.id)} className="bg-green-600 text-white px-5 py-3 rounded-2xl font-black text-[10px] uppercase shadow-lg active:scale-90 transition-all">Receber</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Barra de Navegação Inferior */}
                    <nav className="fixed bottom-0 w-full bg-[#1e293b]/95 backdrop-blur-md p-4 border-t border-slate-700 flex gap-2 z-40">
                        <button onClick={() => setPagina('home')} className={`flex-1 py-4 rounded-2xl font-black text-[10px] tracking-widest transition-all ${pagina === 'home' ? 'bg-orange-600 text-white shadow-lg shadow-orange-900/40' : 'bg-slate-800 text-slate-500'}`}>MESAS</button>
                        
                        <button onClick={() => setPagina('notas')} className={`flex-1 py-4 rounded-2xl font-black text-[10px] tracking-widest transition-all relative ${pagina === 'notas' ? 'bg-orange-600 text-white shadow-lg shadow-orange-900/40' : 'bg-slate-800 text-slate-500'}`}>
                            NOTAS
                            {notas.length > 0 && (
                                <span className="absolute -top-1 -right-1 bg-red-600 text-white text-[8px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-slate-900 animate-bounce">
                                    {notas.length}
                                </span>
                            )}
                        </button>
                        
                        <button onClick={() => setPagina('estoque')} className={`flex-1 py-4 rounded-2xl font-black text-[10px] tracking-widest transition-all ${pagina === 'estoque' ? 'bg-orange-600 text-white shadow-lg shadow-orange-900/40' : 'bg-slate-800 text-slate-500'}`}>ESTOQUE</button>
                    </nav>

                    {/* Modal Detalhes da Mesa */}
                    {idMesaAberta && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-sm z-[60] flex items-end">
                            <div className="bg-slate-900 w-full rounded-t-[40px] p-6 border-t border-slate-700 max-h-[92vh] flex flex-col shadow-2xl">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h2 className="text-3xl font-black text-orange-500 uppercase italic leading-none">Mesa {idMesaAberta}</h2>
                                        {mesaAtual.apelido && <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-2">👤 {mesaAtual.apelido}</p>}
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={handleApelido} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-[10px] font-black border border-slate-600 uppercase">🏷️ Nome</button>
                                        <button onClick={() => setIdMesaAberta(null)} className="bg-slate-800 text-white w-10 h-10 rounded-full font-bold">✕</button>
                                    </div>
                                </div>

                                <div className="bg-slate-950 p-5 rounded-3xl mb-6 border border-slate-800">
                                    <div className="max-h-32 overflow-y-auto no-scrollbar mb-4 space-y-2">
                                        {mesaAtual.itens.length === 0 && <p className="text-center text-slate-700 font-bold uppercase italic text-[10px] py-4">Mesa sem consumo</p>}
                                        {mesaAtual.itens.map((it, i) => (
                                            <div key={i} className="flex justify-between text-[11px] font-bold uppercase text-slate-300 italic">
                                                <span className="truncate pr-4">{it.produto_nome}</span>
                                                <div className="flex gap-4">
                                                    <span>R${it.preco_unidade.toFixed(2)}</span>
                                                    <button onClick={() => handleRemoverItem(it.id)} className="text-red-500 font-black">X</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="text-right text-3xl font-black text-white border-t border-slate-800 pt-3">R$ {mesaAtual.total.toFixed(2)}</div>
                                </div>

                                <div className="flex-1 overflow-y-auto no-scrollbar grid grid-cols-2 gap-3 mb-6">
                                    {produtos.map(p => (
                                        <button key={p.id} onClick={() => handleAddPedido(p)} className="p-4 bg-slate-800 rounded-2xl text-left border border-slate-700 active:scale-95 transition-all">
                                            <div className="text-[10px] font-black text-slate-500 uppercase truncate mb-1">{p.nome}</div>
                                            <div className="font-black text-white text-base">R$ {p.preco.toFixed(2)}</div>
                                            <div className={`text-[8px] font-black mt-2 ${p.estoque <= 5 ? 'text-red-500 animate-pulse' : 'text-slate-500'}`}>Est: {p.estoque}</div>
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={pendurarConta} className="bg-yellow-600 p-5 rounded-2xl font-black uppercase text-[11px] shadow-lg active:scale-95 transition-all text-white">Pendurar Nota</button>
                                    <button onClick={() => handleLimparMesa(idMesaAberta)} className="bg-red-600 p-5 rounded-2xl font-black uppercase text-[11px] shadow-lg active:scale-95 transition-all text-white">Limpar Mesa</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
