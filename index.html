<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JB ESPETO - GESTÃO PRO</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://zpzjpkrglknnhoojglmv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwempwa3JnbGtubmhvb2pnbG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzY4NTUsImV4cCI6MjA5MzA1Mjg1NX0.6BV3CTuBjOXraXnswNBpZoapHF_NDV7P4O1ja_cVNEY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const App = () => {
            const [userLogado, setUserLogado] = useState(null);
            const [pagina, setPagina] = useState('home');
            const [mesas, setMesas] = useState(Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' })));
            const [produtos, setProdutos] = useState([]);
            const [notas, setNotas] = useState([]);
            const [logs, setLogs] = useState([]);
            const [equipe, setEquipe] = useState([]); // Novo estado para equipe
            const [idMesaAberta, setIdMesaAberta] = useState(null);
            const [carregando, setCarregando] = useState(true);

            useEffect(() => {
                const sessao = localStorage.getItem('jb_user_data');
                if (sessao) setUserLogado(JSON.parse(sessao));
                buscarDados();
                const timer = setInterval(buscarDados, 5000);
                return () => clearInterval(timer);
            }, []);

            async function buscarDados() {
                try {
                    const { data: prods } = await supabaseClient.from('produtos').select('*').order('nome');
                    if (prods) setProdutos(prods);

                    const { data: pedidos } = await supabaseClient.from('pedidos').select('*');
                    const novasMesas = Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' }));
                    if (pedidos) {
                        pedidos.forEach(p => {
                            const idx = p.mesa - 1;
                            if (novasMesas[idx]) {
                                novasMesas[idx].itens.push(p);
                                novasMesas[idx].total += p.preco_unidade;
                                if (p.apelido_mesa) novasMesas[idx].apelido = p.apelido_mesa;
                            }
                        });
                    }
                    setMesas(novasMesas);

                    const { data: nts } = await supabaseClient.from('notas_pendentes').select('*').eq('pago', false);
                    if (nts) setNotas(nts);

                    if (userLogado?.nivel === 'admin') {
                        const { data: lg } = await supabaseClient.from('logs_sistema').select('*').order('data', { ascending: false }).limit(30);
                        if (lg) setLogs(lg);

                        const { data: eq } = await supabaseClient.from('usuarios_gestao').select('id, usuario, nivel').order('usuario');
                        if (eq) setEquipe(eq);
                    }
                } catch (err) { console.error(err); }
                setCarregando(false);
            }

            async function registrarLog(acao, detalhes) {
                if (!userLogado) return;
                await supabaseClient.from('logs_sistema').insert([{ usuario: userLogado.usuario, acao, detalhes }]);
            }

            // --- GESTÃO DE EQUIPE ---
            async function handleNovoUsuario(e) {
                e.preventDefault();
                const user = e.target.u.value.toLowerCase().trim();
                const pass = e.target.s.value;
                const nivel = e.target.n.value;

                const { error } = await supabaseClient.from('usuarios_gestao').insert([{ usuario: user, senha: pass, nivel: nivel }]);
                
                if (error) {
                    alert("Erro: Usuário já existe ou conexão falhou.");
                } else {
                    await registrarLog("EQUIPE", `Adicionou novo usuário: ${user} (${nivel})`);
                    alert("Usuário adicionado!");
                    e.target.reset();
                    buscarDados();
                }
            }

            async function removerUsuario(id, nome) {
                if (nome === userLogado.usuario) return alert("Você não pode remover a si mesmo!");
                if (confirm(`Remover ${nome} da equipe?`)) {
                    await registrarLog("EQUIPE", `Removeu usuário: ${nome}`);
                    await supabaseClient.from('usuarios_gestao').delete().eq('id', id);
                    buscarDados();
                }
            }
            // ------------------------

            const realizarLogin = async (e) => {
                e.preventDefault();
                const u = e.target.usuario.value.toLowerCase();
                const p = e.target.senha.value;
                const { data } = await supabaseClient.from('usuarios_gestao').select('*').eq('usuario', u).eq('senha', p).single();
                if (data) {
                    setUserLogado(data);
                    localStorage.setItem('jb_user_data', JSON.stringify(data));
                } else { alert("Acesso inválido!"); }
            };

            const sair = () => {
                localStorage.removeItem('jb_user_data');
                setUserLogado(null);
            };

            if (!userLogado) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-950 p-6">
                        <form onSubmit={realizarLogin} className="w-full max-w-sm bg-slate-900 p-8 rounded-[40px] border border-slate-800">
                            <h1 className="text-4xl font-black text-center text-white mb-8 italic underline decoration-orange-500">JB ESPETO</h1>
                            <input name="usuario" placeholder="Usuário" className="w-full p-4 mb-4 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700" required />
                            <input name="senha" type="password" placeholder="Senha" className="w-full p-4 mb-6 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700" required />
                            <button className="w-full bg-orange-600 text-white p-4 rounded-2xl font-black uppercase">Entrar</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-32">
                    <header className="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
                        <div><h1 className="font-black italic text-xl">JB <span className="text-orange-500 uppercase">Espeto</span></h1></div>
                        <button onClick={sair} className="text-[10px] font-black text-red-500 bg-red-500/10 px-3 py-2 rounded-lg">SAIR</button>
                    </header>

                    <main className="p-4">
                        {pagina === 'home' && (
                            <div className="grid grid-cols-2 gap-3">
                                {mesas.map(m => (
                                    <div key={m.id} onClick={() => setIdMesaAberta(m.id)} className={`p-4 rounded-2xl border-2 transition-all ${m.total > 0 ? 'bg-orange-600 border-orange-400' : 'bg-slate-800 border-slate-700 opacity-60'}`}>
                                        <div className="text-[10px] font-black uppercase text-white/70 italic">Mesa {m.id}</div>
                                        <div className="text-xl font-black text-white">R$ {m.total.toFixed(2)}</div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {pagina === 'equipe' && userLogado.nivel === 'admin' && (
                            <div className="space-y-6">
                                <form onSubmit={handleNovoUsuario} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3">
                                    <h2 className="text-orange-500 font-black uppercase text-xs mb-2">Novo Membro</h2>
                                    <input name="u" placeholder="Usuário" className="w-full p-3 bg-slate-800 rounded-xl outline-none text-sm" required />
                                    <input name="s" placeholder="Senha" className="w-full p-3 bg-slate-800 rounded-xl outline-none text-sm" required />
                                    <select name="n" className="w-full p-3 bg-slate-800 rounded-xl outline-none text-sm text-white">
                                        <option value="caixa">Nível: Caixa</option>
                                        <option value="admin">Nível: Administrador</option>
                                    </select>
                                    <button className="w-full bg-orange-600 p-3 rounded-xl font-black uppercase text-xs">Cadastrar</button>
                                </form>

                                <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800">
                                    <h2 className="text-slate-500 font-black uppercase text-[10px] mb-4">Membros Ativos</h2>
                                    {equipe.map(m => (
                                        <div key={m.id} className="flex justify-between items-center py-3 border-b border-slate-800 last:border-0">
                                            <div>
                                                <div className="font-black uppercase text-sm">{m.usuario}</div>
                                                <div className="text-[9px] text-orange-500 font-bold uppercase">{m.nivel}</div>
                                            </div>
                                            <button onClick={() => removerUsuario(m.id, m.usuario)} className="text-red-500/50 text-xl">🗑️</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ... Outras páginas (Estoque, Notas, Logs) mantêm a mesma lógica ... */}
                        {pagina === 'logs' && userLogado.nivel === 'admin' && (
                            <div className="space-y-3">
                                {logs.map(l => (
                                    <div key={l.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 border-l-4 border-l-orange-600">
                                        <div className="flex justify-between font-black text-slate-500 text-[9px] mb-1">
                                            <span>👤 {l.usuario}</span>
                                            <span>{new Date(l.data).toLocaleString()}</span>
                                        </div>
                                        <div className="text-white font-black uppercase text-xs">{l.acao}</div>
                                        <div className="text-slate-400 text-[10px] italic mt-1">{l.detalhes}</div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-md p-4 border-t border-slate-800 flex gap-2 overflow-x-auto no-scrollbar">
                        <button onClick={() => setPagina('home')} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] ${pagina === 'home' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>MESAS</button>
                        <button onClick={() => setPagina('equipe')} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] ${pagina === 'equipe' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>EQUIPE</button>
                        <button onClick={() => setPagina('estoque')} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] ${pagina === 'estoque' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>ESTOQUE</button>
                        <button onClick={() => setPagina('logs')} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] ${pagina === 'logs' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>LOGS</button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
