<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JB ESPETO - Gestão Cloud</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        /* Esconde a barra de rolagem mas mantém a funcionalidade */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = 'https://zpzjpkrglknnhoojglmv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwempwa3JnbGtubmhvb2pnbG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzY4NTUsImV4cCI6MjA5MzA1Mjg1NX0.6BV3CTuBjOXraXnswNBpZoapHF_NDV7P4O1ja_cVNEY'; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { useState, useEffect } = React;

        const App = () => {
            const [mesas, setMesas] = useState(Array.from({ length: 10 }, (_, i) => ({ id: i + 1, itens: [], total: 0 })));
            const [produtos, setProdutos] = useState([]);
            const [pagina, setPagina] = useState('home');
            const [idMesaAberta, setIdMesaAberta] = useState(null);
            const [carregando, setCarregando] = useState(true);

            useEffect(() => { buscarDados(); }, []);

            async function buscarDados() {
                setCarregando(true);
                try {
                    const { data: prods } = await supabaseClient.from('produtos').select('*').order('nome');
                    if (prods) setProdutos(prods);

                    const { data: pedidos } = await supabaseClient.from('pedidos').select('*');
                    const novasMesas = Array.from({ length: 10 }, (_, i) => ({ id: i + 1, itens: [], total: 0 }));
                    
                    if (pedidos) {
                        pedidos.forEach(p => {
                            const mIndex = p.mesa - 1;
                            if (novasMesas[mIndex]) {
                                novasMesas[mIndex].itens.push(p);
                                novasMesas[mIndex].total += p.preco_unidade;
                            }
                        });
                    }
                    setMesas(novasMesas);
                } catch (err) { console.error(err); }
                setCarregando(false);
            }

            async function adicionarItem(produto) {
                if (produto.estoque <= 0) return alert("Estoque esgotado!");
                const { error: errPedido } = await supabaseClient.from('pedidos').insert([
                    { mesa: idMesaAberta, produto_nome: produto.nome, preco_unidade: produto.preco }
                ]);
                const { error: errEstoque } = await supabaseClient.from('produtos')
                    .update({ estoque: produto.estoque - 1 })
                    .eq('id', produto.id);
                if (!errPedido && !errEstoque) buscarDados();
            }

            async function fecharConta(mesaId) {
                if(confirm(`Deseja limpar a Mesa ${mesaId}?`)) {
                    await supabaseClient.from('pedidos').delete().eq('mesa', mesaId);
                    setIdMesaAberta(null);
                    buscarDados();
                }
            }

            async function cadastrarNovo(e) {
                e.preventDefault();
                const novo = {
                    nome: e.target.nome.value,
                    preco: parseFloat(e.target.preco.value),
                    estoque: parseInt(e.target.estoque.value)
                };
                const { error } = await supabaseClient.from('produtos').insert([novo]);
                if (!error) { e.target.reset(); buscarDados(); alert("Salvo no JB Espeto!"); }
            }

            if (carregando) return (
                <div className="h-screen flex flex-col items-center justify-center bg-[#0f172a]">
                    <div className="text-3xl font-black text-orange-500 animate-pulse tracking-tighter">JB ESPETO</div>
                    <div className="text-slate-500 text-sm mt-2">Conectando...</div>
                </div>
            );

            const mesaAtual = mesas.find(m => m.id === idMesaAberta);

            return (
                <div className="min-h-screen pb-24">
                    {/* Header Dark */}
                    <header className="bg-[#1e293b] p-6 shadow-xl flex justify-between items-center mb-6 border-b border-slate-700">
                        <h1 className="text-2xl font-black text-white italic">JB <span className="text-orange-500">ESPETO</span></h1>
                        <button onClick={buscarDados} className="bg-slate-700 p-2 rounded-full hover:bg-slate-600 transition-colors">🔄</button>
                    </header>

                    {/* Nav Dark */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-[#1e293b]/90 backdrop-blur-md border-t border-slate-700 p-4 flex gap-4 z-40">
                        <button onClick={() => setPagina('home')} className={`flex-1 p-4 rounded-2xl font-black transition-all ${pagina === 'home' ? 'bg-orange-600 text-white shadow-lg shadow-orange-900/20' : 'bg-slate-800 text-slate-500'}`}>MESAS</button>
                        <button onClick={() => setPagina('estoque')} className={`flex-1 p-4 rounded-2xl font-black transition-all ${pagina === 'estoque' ? 'bg-orange-600 text-white shadow-lg shadow-orange-900/20' : 'bg-slate-800 text-slate-500'}`}>ESTOQUE</button>
                    </nav>

                    <main className="px-4">
                        {pagina === 'home' && (
                            <div className="grid grid-cols-2 gap-4 animate-in fade-in">
                                {mesas.map(m => (
                                    <div key={m.id} onClick={() => setIdMesaAberta(m.id)} className={`p-6 rounded-[30px] border-2 transition-all active:scale-95 ${m.total > 0 ? 'bg-orange-600 border-orange-400 text-white shadow-2xl shadow-orange-900/40' : 'bg-slate-800 border-slate-700'}`}>
                                        <div className="text-[10px] font-black opacity-60 uppercase tracking-widest">Mesa {m.id}</div>
                                        <div className="text-2xl font-black mt-1">R$ {m.total.toFixed(2)}</div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {pagina === 'estoque' && (
                            <div className="space-y-6">
                                <form onSubmit={cadastrarNovo} className="bg-[#1e293b] p-6 rounded-[30px] shadow-sm space-y-4 border border-slate-700">
                                    <h2 className="font-black text-slate-400 text-xs tracking-widest uppercase">Cadastrar Item</h2>
                                    <input name="nome" placeholder="Nome do Espeto/Bebida" className="w-full p-4 bg-slate-800 rounded-2xl outline-none border border-slate-700 focus:border-orange-500 text-white" required />
                                    <div className="flex gap-2">
                                        <input name="preco" type="number" step="0.01" placeholder="R$" className="flex-1 p-4 bg-slate-800 rounded-2xl outline-none border border-slate-700 text-white" required />
                                        <input name="estoque" type="number" placeholder="Qtd" className="flex-1 p-4 bg-slate-800 rounded-2xl outline-none border border-slate-700 text-white" required />
                                    </div>
                                    <button className="w-full bg-orange-600 text-white p-4 rounded-2xl font-black hover:bg-orange-500">SALVAR NO SISTEMA</button>
                                </form>

                                <div className="bg-[#1e293b] p-6 rounded-[30px] shadow-sm border border-slate-700">
                                    <h2 className="font-black text-slate-400 mb-4 text-xs uppercase tracking-widest">Lista de Estoque</h2>
                                    {produtos.map(p => (
                                        <div key={p.id} className="flex justify-between items-center py-4 border-b border-slate-800 last:border-0">
                                            <div>
                                                <div className="font-bold text-slate-200">{p.nome}</div>
                                                <div className="text-xs font-black text-orange-500 uppercase tracking-tighter">R$ {p.preco.toFixed(2)}</div>
                                            </div>
                                            <div className={`font-black text-[10px] px-3 py-1 rounded-full ${p.estoque < 5 ? 'bg-red-600 text-white animate-pulse' : 'bg-slate-700 text-slate-300'}`}>
                                                {p.estoque} UN
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modal Dark */}
                    {idMesaAberta && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center p-4">
                            <div className="bg-[#1e293b] w-full max-w-lg rounded-[40px] p-8 border-t border-slate-600 shadow-2xl animate-in slide-in-from-bottom">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-3xl font-black text-white italic">Mesa {idMesaAberta}</h2>
                                    <button onClick={() => setIdMesaAberta(null)} className="bg-slate-700 text-white w-12 h-12 rounded-full font-bold">✕</button>
                                </div>

                                <div className="space-y-2 mb-6 max-h-40 overflow-y-auto no-scrollbar">
                                    {mesaAtual.itens.map((it, idx) => (
                                        <div key={idx} className="flex justify-between font-bold text-slate-400 text-sm border-b border-slate-800 pb-2">
                                            <span>{it.produto_nome}</span>
                                            <span className="text-white font-mono">R$ {it.preco_unidade.toFixed(2)}</span>
                                        </div>
                                    ))}
                                    {mesaAtual.itens.length === 0 && <p className="text-center text-slate-600 py-4 italic">Nenhum pedido lançado.</p>}
                                </div>

                                <div className="text-5xl font-black text-orange-500 mb-8 text-right tracking-tighter">
                                    <span className="text-[10px] text-slate-500 uppercase tracking-widest mr-2 font-normal">Total</span>
                                    R$ {mesaAtual.total.toFixed(2)}
                                </div>

                                <div className="grid grid-cols-2 gap-2 mb-6">
                                    {produtos.map(p => (
                                        <button key={p.id} onClick={() => adicionarItem(p)} className="p-4 bg-slate-800 rounded-2xl text-left border-2 border-transparent active:border-orange-500 transition-all">
                                            <div className="font-bold text-[10px] text-slate-500 uppercase">{p.nome}</div>
                                            <div className="font-black text-white text-sm">R$ {p.preco.toFixed(2)}</div>
                                        </button>
                                    ))}
                                </div>

                                <button onClick={() => fecharConta(idMesaAberta)} className="w-full bg-red-600 text-white p-5 rounded-[25px] font-black shadow-lg shadow-red-900/20 active:scale-95 transition-all uppercase tracking-widest">
                                    LIMPAR MESA / PAGAMENTO
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
