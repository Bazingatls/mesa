<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JB ESPETO - GESTÃO</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes pulse-red {
            0%, 100% { background-color: #991b1b; border-color: #f87171; }
            50% { background-color: #ef4444; border-color: #ffffff; }
        }
        .animate-alert { animation: pulse-red 1.5s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configurações do Banco de Dados
        const SUPABASE_URL = 'https://zpzjpkrglknnhoojglmv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwempwa3JnbGtubmhvb2pnbG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzY4NTUsImV4cCI6MjA5MzA1Mjg1NX0.6BV3CTuBjOXraXnswNBpZoapHF_NDV7P4O1ja_cVNEY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const App = () => {
            const [logado, setLogado] = useState(false);
            const [pagina, setPagina] = useState('home');
            const [mesas, setMesas] = useState(Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' })));
            const [produtos, setProdutos] = useState([]);
            const [idMesaAberta, setIdMesaAberta] = useState(null);
            const [carregando, setCarregando] = useState(true);

            // Logins Disponíveis
            const USUARIOS_PERMITIDOS = [
                { user: "teta", pass: "teta" },
                { user: "bruno", pass: "cajado" }
            ];

            // 1. Verificação de Sessão e Carregamento Inicial
            useEffect(() => {
                const sessao = localStorage.getItem('jb_sessao_ativa');
                if (sessao === 'sim') {
                    setLogado(true);
                }
                buscarDados();
                const timer = setInterval(buscarDados, 5000);
                return () => clearInterval(timer);
            }, []);

            // 2. Busca de Dados no Supabase
            async function buscarDados() {
                try {
                    const { data: prods } = await supabaseClient.from('produtos').select('*').order('nome');
                    if (prods) setProdutos(prods);

                    const { data: pedidos } = await supabaseClient.from('pedidos').select('*');
                    const novasMesas = Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' }));
                    
                    if (pedidos) {
                        pedidos.forEach(p => {
                            const idx = p.mesa - 1;
                            if (novasMesas[idx]) {
                                novasMesas[idx].itens.push(p);
                                novasMesas[idx].total += p.preco_unidade;
                                if (p.apelido_mesa) novasMesas[idx].apelido = p.apelido_mesa;
                            }
                        });
                    }
                    setMesas(novasMesas);
                } catch (err) { console.error("Erro ao buscar:", err); }
                setCarregando(false);
            }

            // 3. Funções de Autenticação
            const realizarLogin = (e) => {
                e.preventDefault();
                const u = e.target.usuario.value;
                const p = e.target.senha.value;
                const sucesso = USUARIOS_PERMITIDOS.find(item => item.user === u && item.pass === p);

                if (sucesso) {
                    setLogado(true);
                    localStorage.setItem('jb_sessao_ativa', 'sim');
                } else {
                    alert("Usuário ou senha inválidos!");
                }
            };

            const realizarSair = () => {
                localStorage.removeItem('jb_sessao_ativa');
                setLogado(false);
            };

            // 4. Funções de Gerenciamento
            async function handleApelido() {
                const nome = prompt("Nome do cliente:");
                if (nome !== null) {
                    await supabaseClient.from('pedidos').update({ apelido_mesa: nome }).eq('mesa', idMesaAberta);
                    buscarDados();
                }
            }

            async function handleAddPedido(prod) {
                if (prod.estoque <= 0) return alert("Sem estoque disponível!");
                const mesa = mesas.find(m => m.id === idMesaAberta);
                await supabaseClient.from('pedidos').insert([{ 
                    mesa: idMesaAberta, 
                    produto_nome: prod.nome, 
                    preco_unidade: prod.preco, 
                    apelido_mesa: mesa.apelido 
                }]);
                await supabaseClient.from('produtos').update({ estoque: prod.estoque - 1 }).eq('id', prod.id);
                buscarDados();
            }

            async function handleRemoverItem(id) {
                await supabaseClient.from('pedidos').delete().eq('id', id);
                buscarDados();
            }

            async function handleLimparMesa(id) {
                if (confirm(`Limpar todos os itens da Mesa ${id}?`)) {
                    await supabaseClient.from('pedidos').delete().eq('mesa', id);
                    setIdMesaAberta(null);
                    buscarDados();
                }
            }

            async function handleSalvarEstoque(id, valor) {
                const qtd = parseInt(valor);
                if (!isNaN(qtd)) {
                    await supabaseClient.from('produtos').update({ estoque: qtd }).eq('id', id);
                    buscarDados();
                }
            }

            async function handleExcluirProd(id) {
                if (confirm("Excluir este produto do cardápio?")) {
                    await supabaseClient.from('produtos').delete().eq('id', id);
                    buscarDados();
                }
            }

            async function handleNovoProd(e) {
                e.preventDefault();
                const obj = { nome: e.target.n.value, preco: parseFloat(e.target.p.value), estoque: parseInt(e.target.e.value) };
                await supabaseClient.from('produtos').insert([obj]);
                e.target.reset();
                buscarDados();
            }

            // TELA DE LOGIN (Se não estiver logado)
            if (!logado) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-950 p-6">
                        <form onSubmit={realizarLogin} className="w-full max-w-sm bg-slate-900 p-8 rounded-[40px] border border-slate-800 shadow-2xl">
                            <div className="text-center mb-8">
                                <h1 className="text-4xl font-black italic text-white underline decoration-orange-500 underline-offset-8">JB ESPETO</h1>
                                <p className="text-slate-500 text-[10px] font-black uppercase tracking-[0.3em] mt-6">Acesso Administrativo</p>
                            </div>
                            <div className="space-y-4">
                                <input name="usuario" placeholder="Usuário" className="w-full p-4 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700 focus:border-orange-500 font-bold" required />
                                <input name="senha" type="password" placeholder="Senha" className="w-full p-4 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700 focus:border-orange-500 font-bold" required />
                                <button className="w-full bg-orange-600 text-white p-4 rounded-2xl font-black uppercase shadow-lg active:scale-95 transition-all mt-2">Entrar</button>
                            </div>
                        </form>
                    </div>
                );
            }

            if (carregando) return <div className="h-screen flex items-center justify-center text-orange-500 font-black italic animate-pulse">CARREGANDO JB ESPETO...</div>;

            const mesaAtual = mesas.find(m => m.id === idMesaAberta);

            return (
                <div className="min-h-screen pb-28">
                    {/* Header */}
                    <header className="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50 shadow-xl">
                        <h1 className="font-black italic text-xl">JB <span className="text-orange-500 uppercase">Espeto</span></h1>
                        <button onClick={realizarSair} className="text-[9px] font-black text-red-500 bg-red-500/10 px-3 py-2 rounded-lg border border-red-500/20 uppercase">Sair</button>
                    </header>

                    <main className="p-4">
                        {pagina === 'home' ? (
                            <div className="grid grid-cols-2 gap-3">
                                {mesas.map(m => (
                                    <div key={m.id} onClick={() => setIdMesaAberta(m.id)} className={`p-4 rounded-2xl border-2 transition-all active:scale-95 ${m.total > 0 ? 'bg-orange-600 border-orange-400 shadow-lg' : 'bg-slate-800 border-slate-700 opacity-60'}`}>
                                        <div className="text-[10px] font-black uppercase opacity-60 italic text-white">Mesa {m.id}</div>
                                        <div className="text-xl font-black text-white">R$ {m.total.toFixed(2)}</div>
                                        {m.apelido && <div className="text-[9px] bg-black/30 p-1 mt-1 rounded font-bold text-white uppercase truncate text-center">{m.apelido}</div>}
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <form onSubmit={handleNovoProd} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-lg space-y-3">
                                    <h2 className="text-[10px] font-black text-slate-500 uppercase tracking-widest text-center">Cadastrar Novo Produto</h2>
                                    <input name="n" placeholder="Nome" className="w-full p-4 bg-slate-800 rounded-xl outline-none border border-slate-700 text-sm text-white" required />
                                    <div className="flex gap-2">
                                        <input name="p" type="number" step="0.01" placeholder="R$ Preço" className="flex-1 p-4 bg-slate-800 rounded-xl border border-slate-700 text-sm text-white" required />
                                        <input name="e" type="number" placeholder="Estoque" className="w-24 p-4 bg-slate-800 rounded-xl border border-slate-700 text-sm text-white" required />
                                    </div>
                                    <button className="w-full bg-orange-600 p-4 rounded-xl font-black uppercase text-xs shadow-lg">Salvar Produto</button>
                                </form>

                                <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800 shadow-lg">
                                    <h3 className="text-[10px] font-black text-slate-500 uppercase mb-4 px-1">Gestão de Estoque</h3>
                                    {produtos.map(p => (
                                        <div key={p.id} className="flex justify-between items-center py-4 border-b border-slate-800 last:border-0">
                                            <div className="flex-1 pr-2">
                                                <div className="font-bold text-slate-200 text-sm uppercase truncate">{p.nome}</div>
                                                <div className="text-[10px] font-black text-orange-500 uppercase">R$ {p.preco.toFixed(2)}</div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <input 
                                                    type="number" 
                                                    defaultValue={p.estoque} 
                                                    onBlur={(e) => handleSalvarEstoque(p.id, e.target.value)}
                                                    className={`w-14 p-2 text-center rounded-lg font-black text-xs border-2 ${p.estoque <= 5 ? 'animate-alert border-white text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`} 
                                                />
                                                <button onClick={() => handleExcluirProd(p.id)} className="bg-red-900/20 p-2 rounded-lg text-red-500 text-sm active:scale-75 transition-all">🗑️</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Navbar */}
                    <nav className="fixed bottom-0 w-full bg-[#1e293b]/95 backdrop-blur-md p-4 border-t border-slate-700 flex gap-4 z-40">
                        <button onClick={() => setPagina('home')} className={`flex-1 py-4 rounded-2xl font-black text-xs tracking-widest ${pagina === 'home' ? 'bg-orange-600 text-white shadow-lg shadow-orange-900/20' : 'bg-slate-800 text-slate-500'}`}>MESAS</button>
                        <button onClick={() => setPagina('estoque')} className={`flex-1 py-4 rounded-2xl font-black text-xs tracking-widest ${pagina === 'estoque' ? 'bg-orange-600 text-white shadow-lg shadow-orange-900/20' : 'bg-slate-800 text-slate-400'}`}>ESTOQUE</button>
                    </nav>

                    {/* Modal da Mesa */}
                    {idMesaAberta && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-sm z-[60] flex items-end">
                            <div className="bg-slate-900 w-full rounded-t-[40px] p-8 border-t border-slate-700 max-h-[92vh] flex flex-col shadow-2xl">
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h2 className="text-3xl font-black text-orange-500 uppercase italic leading-none">Mesa {idMesaAberta}</h2>
                                        {mesaAtual.apelido && <p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mt-2">{mesaAtual.apelido}</p>}
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={handleApelido} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-[10px] font-black border border-slate-600 uppercase italic">🏷️ Nome</button>
                                        <button onClick={() => setIdMesaAberta(null)} className="bg-slate-800 text-white w-10 h-10 rounded-full font-bold">✕</button>
                                    </div>
                                </div>

                                <div className="bg-slate-950 p-5 rounded-3xl mb-6 border border-slate-800">
                                    <div className="max-h-40 overflow-y-auto no-scrollbar space-y-3 mb-4">
                                        {mesaAtual.itens.length === 0 && <p className="text-center text-slate-600 text-[10px] font-bold uppercase italic py-4">Nenhum item pedido</p>}
                                        {mesaAtual.itens.map((it, i) => (
                                            <div key={i} className="flex justify-between text-xs font-bold uppercase text-slate-300">
                                                <span className="truncate pr-4 italic">{it.produto_nome}</span>
                                                <div className="flex gap-4 items-center">
                                                    <span className="text-white">R${it.preco_unidade.toFixed(2)}</span>
                                                    <button onClick={() => handleRemoverItem(it.id)} className="text-red-500 font-black px-2">✕</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="text-right text-3xl font-black text-white border-t border-slate-800 pt-3">R$ {mesaAtual.total.toFixed(2)}</div>
                                </div>

                                <div className="flex-1 overflow-y-auto no-scrollbar grid grid-cols-2 gap-3 mb-6">
                                    {produtos.map(p => (
                                        <button key={p.id} onClick={() => handleAddPedido(p)} className="p-4 bg-slate-800 rounded-2xl text-left border border-slate-700 active:scale-95 transition-all">
                                            <div className="text-[10px] font-black text-slate-500 uppercase truncate mb-1">{p.nome}</div>
                                            <div className="font-black text-white text-base">R$ {p.preco.toFixed(2)}</div>
                                            <div className={`text-[9px] font-black mt-2 ${p.estoque <= 5 ? 'text-red-500 animate-pulse' : 'text-slate-500'}`}>Stock: {p.estoque}</div>
                                        </button>
                                    ))}
                                </div>

                                <button onClick={() => handleLimparMesa(idMesaAberta)} className="w-full bg-red-600 p-5 rounded-2xl font-black uppercase text-xs shadow-lg active:scale-95 transition-all">Fechar e Limpar Mesa</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
