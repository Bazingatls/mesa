<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JB ESPETO - GESTÃO TOTAL</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { background-color: #ea580c !important; color: white !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;
        const SUPABASE_URL = 'https://zpzjpkrglknnhoojglmv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwempwa3JnbGtubmhvb2pnbG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzY4NTUsImV4cCI6MjA5MzA1Mjg1NX0.6BV3CTuBjOXraXnswNBpZoapHF_NDV7P4O1ja_cVNEY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Funções seguras de acesso ao LocalStorage (evita tela preta por bloqueios de privacidade)
        const safeGetItem = (key, fallback) => {
            try {
                const val = localStorage.getItem(key);
                return val !== null ? val : fallback;
            } catch (e) {
                return fallback;
            }
        };

        const safeSetItem = (key, value) => {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                console.warn("Armazenamento local indisponível:", e);
            }
        };

        const safeRemoveItem = (key) => {
            try {
                localStorage.removeItem(key);
            } catch (e) {}
        };

        // Função auxiliar para obter cor do badge de logs
        const obterBadgeAcao = (acao) => {
            const acaoLimpa = (acao || '').toUpperCase();
            if (acaoLimpa.includes('EXCLUSÃO') || acaoLimpa.includes('REMOVE') || acaoLimpa.includes('DELET')) {
                return 'bg-red-500/20 text-red-400 border border-red-500/30';
            }
            if (acaoLimpa.includes('EDIÇÃO') || acaoLimpa.includes('EDIT')) {
                return 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
            }
            if (acaoLimpa.includes('FIADO')) {
                return 'bg-yellow-500/20 text-yellow-500 border border-yellow-500/30';
            }
            if (acaoLimpa.includes('PAGO') || acaoLimpa.includes('VENDA') || acaoLimpa.includes('RECEB')) {
                return 'bg-green-500/20 text-green-400 border border-green-500/30';
            }
            if (acaoLimpa.includes('GASTO')) {
                return 'bg-rose-500/20 text-rose-400 border border-rose-500/30';
            }
            return 'bg-slate-700/50 text-slate-300 border border-slate-600/30';
        };

        // Função auxiliar para obter cor do badge de etiquetas dos produtos
        const obterCorCategoria = (cat) => {
            const c = (cat || '').toUpperCase();
            switch (c) {
                case 'CERVEJA': return 'bg-amber-500/20 text-amber-400 border border-amber-500/30';
                case 'BAR': return 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
                case 'DOSE': case 'DOSES': return 'bg-purple-500/20 text-purple-400 border border-purple-500/30';
                case 'ESPETO': return 'bg-rose-500/20 text-rose-400 border border-rose-500/30';
                case 'COZINHA': return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                default: return 'bg-slate-700/50 text-slate-400 border border-slate-600/30';
            }
        };

        const App = () => {
            const [userLogado, setUserLogado] = useState(null);
            const [pagina, setPagina] = useState('home');
            
            // Inicialização segura de mesas
            const [qtdMesas, setQtdMesas] = useState(() => {
                const num = Number(safeGetItem('jb_qtd_mesas', '12'));
                return (num && num > 0) ? num : 12;
            });
            const [mesas, setMesas] = useState(() => {
                const num = Number(safeGetItem('jb_qtd_mesas', '12'));
                const length = (num && num > 0) ? num : 12;
                return Array.from({ length }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' }));
            });
            const [produtos, setProdutos] = useState([]);
            
            // Inicializa as categorias padrão diretamente no estado para evitar falhas locais offline
            const [categoriasDb, setCategoriasDb] = useState([
                { nome: 'Cerveja', emoji: '🍺' },
                { nome: 'Bar', emoji: '🍹' },
                { nome: 'Espeto', emoji: '🍢' },
                { nome: 'Doses', emoji: '🥃' },
                { nome: 'Cozinha', emoji: '🍳' },
                { nome: 'Outros', emoji: '📦' }
            ]);
            const [notas, setNotas] = useState([]);
            const [logs, setLogs] = useState([]);
            const [gastos, setGastos] = useState([]); 
            const [equipe, setEquipe] = useState([]);
            const [idMesaAberta, setIdMesaAberta] = useState(null);
            const [buscaProduto, setBuscaProduto] = useState('');
            const [categoriaSelecionada, setCategoriaSelecionada] = useState('Todos'); 
            const [produtoEditando, setProdutoEditando] = useState(null);

            // Estados adicionais para filtro e paginação de Logs
            const [filtroUsuarioLog, setFiltroUsuarioLog] = useState('');
            const [paginaLog, setPaginaLog] = useState(1);
            const logsPorPagina = 30;

            // Método de busca tradicional sem desestruturação de aliases (Previne travamento do Babel ao testar offline)
            const buscarDados = useCallback(async () => {
                try {
                    // 1. Carrega Produtos
                    const resProds = await supabaseClient.from('produtos').select('*').order('nome');
                    if (resProds && resProds.data) {
                        setProdutos(resProds.data);
                    }

                    // 2. Carrega Categorias Dinâmicas (Se der erro offline, mantém as padrões sem quebrar)
                    const resCats = await supabaseClient.from('categorias').select('*').order('nome');
                    if (resCats && Array.isArray(resCats.data)) {
                        if (resCats.data.length === 0) {
                            // Se a tabela existe mas está vazia, o sistema semeia as de fábrica automaticamente
                            const padroes = [
                                { nome: 'Cerveja', emoji: '🍺' },
                                { nome: 'Bar', emoji: '🍹' },
                                { nome: 'Espeto', emoji: '🍢' },
                                { nome: 'Doses', emoji: '🥃' },
                                { nome: 'Cozinha', emoji: '🍳' },
                                { nome: 'Outros', emoji: '📦' }
                            ];
                            await supabaseClient.from('categorias').insert(padroes);
                            const resRecats = await supabaseClient.from('categorias').select('*').order('nome');
                            if (resRecats && resRecats.data) {
                                setCategoriasDb(resRecats.data);
                            }
                        } else {
                            setCategoriasDb(resCats.data);
                        }
                    }

                    // 3. Carrega Quantidade de Mesas Sincronizada
                    const resConfig = await supabaseClient.from('configuracoes_sistema').select('*').eq('chave', 'qtd_mesas').single();
                    let mesasCount = qtdMesas;
                    if (resConfig && resConfig.data) {
                        const num = Number(resConfig.data.valor);
                        if (num && num > 0) {
                            mesasCount = num;
                            if (num !== qtdMesas) {
                                setQtdMesas(num);
                                safeSetItem('jb_qtd_mesas', num);
                            }
                        }
                    }

                    // 4. Carrega Consumos Ativos (Pedidos)
                    const resPedidos = await supabaseClient.from('pedidos').select('*');
                    const novasMesas = Array.from({ length: mesasCount }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' }));
                    if (resPedidos && resPedidos.data) {
                        resPedidos.data.forEach(p => {
                            const idx = p.mesa - 1;
                            if (novasMesas[idx]) {
                                novasMesas[idx].itens.push(p);
                                novasMesas[idx].total += Number(p.preco_unidade);
                                if (p.apelido_mesa) novasMesas[idx].apelido = p.apelido_mesa;
                            }
                        });
                    }
                    setMesas(novasMesas);

                    // 5. Carrega Notas Pendentes
                    const resNotas = await supabaseClient.from('notas_pendentes').select('*').eq('pago', false).order('data', { ascending: false });
                    if (resNotas && resNotas.data) {
                        setNotas(resNotas.data);
                    }

                    // 6. Carrega Histórico de Logs
                    const resLogs = await supabaseClient.from('logs_sistema').select('*').order('data', { ascending: false }).limit(1000);
                    if (resLogs && resLogs.data) {
                        setLogs(resLogs.data);
                    }

                    // 7. Carrega Listagem de Gastos / Insumos
                    const resGastos = await supabaseClient.from('gastos').select('*').order('data', { ascending: false });
                    if (resGastos && resGastos.data) {
                        setGastos(resGastos.data);
                    }

                    // 8. Carrega Membros da Equipe
                    const resEquipe = await supabaseClient.from('usuarios_gestao').select('id, usuario, nivel').order('usuario');
                    if (resEquipe && resEquipe.data) {
                        setEquipe(resEquipe.data);
                    }
                } catch (e) { 
                    console.error("Erro na busca local de dados:", e);
                }
            }, [qtdMesas]);

            // Mapeamento unificado de categorias (Evita loops de compilação do Babel)
            const categoriasAtendimento = useMemo(() => {
                const listaUnificada = [
                    { id: 'Todos', label: 'Todos', emoji: '🍽️', nome: 'Todos' }
                ];
                
                const fontes = categoriasDb || [
                    { nome: 'Cerveja', emoji: '🍺' },
                    { nome: 'Bar', emoji: '🍹' },
                    { nome: 'Espeto', emoji: '🍢' },
                    { nome: 'Doses', emoji: '🥃' },
                    { nome: 'Cozinha', emoji: '🍳' },
                    { nome: 'Outros', emoji: '📦' }
                ];

                fontes.forEach(c => {
                    listaUnificada.push({
                        id: c.nome,
                        label: c.nome,
                        nome: c.nome,
                        emoji: c.emoji || '📦'
                    });
                });
                
                return listaUnificada;
            }, [categoriasDb]);

            useEffect(() => {
                const sessao = safeGetItem('jb_user_data', null);
                if (sessao) {
                    try {
                        setUserLogado(JSON.parse(sessao));
                    } catch (err) {
                        safeRemoveItem('jb_user_data');
                    }
                }
                buscarDados();
                const t = setInterval(buscarDados, 5000);
                return () => clearInterval(t);
            }, [buscarDados]);

            // Redireciona o usuário para a página Home caso ele não seja Admin e tente acessar outra aba
            useEffect(() => {
                if (userLogado && userLogado.nivel !== 'admin' && pagina !== 'home') {
                    setPagina('home');
                }
            }, [userLogado, pagina]);

            const registrarLog = async (acao, detalhes) => {
                if(!userLogado) return;
                await supabaseClient.from('logs_sistema').insert([{ usuario: userLogado.usuario, acao, detalhes }]);
                buscarDados();
            };

            // ---- FUNÇÕES ASSÍNCRONAS EXTERNALIZADAS DO JSX ----
            
            const realizarLogin = async (e) => {
                e.preventDefault();
                try {
                    const { data } = await supabaseClient.from('usuarios_gestao').select('*').eq('usuario', e.target.u.value.toLowerCase()).eq('senha', e.target.s.value).single();
                    if (data) { 
                        setUserLogado(data);
                        safeSetItem('jb_user_data', JSON.stringify(data)); 
                        buscarDados(); 
                    }
                    else alert("Credenciais incorretas");
                } catch (err) {
                    console.error(err);
                }
            };

            const adicionarNovaCategoria = async (e) => {
                e.preventDefault();
                const nome = e.target.catNome.value.trim();
                const emoji = e.target.catEmoji.value.trim() || '📦';
                if (!nome) return;
                try {
                    const { error } = await supabaseClient.from('categorias').insert([{ nome, emoji }]);
                    if (error) throw error;
                    registrarLog("ESTOQUE", `Nova categoria: ${nome} [${emoji}]`);
                    e.target.reset();
                    buscarDados();
                } catch (err) {
                    console.error(err);
                    alert("Erro ao salvar categoria (talvez uma etiqueta com esse nome já exista).");
                }
            };

            const adicionarNovoProduto = async (e) => {
                e.preventDefault();
                const nome = e.target.nome.value;
                const preco_compra = parseFloat(e.target.preco_compra.value) || 0;
                const preco = parseFloat(e.target.preco.value) || 0;
                const estoque = parseInt(e.target.estoque.value) || 0;
                const category = e.target.categoria.value;
                try {
                    await supabaseClient.from('produtos').insert([{ 
                        nome, 
                        preco_compra, 
                        preco, 
                        estoque, 
                        categoria: category 
                    }]);
                    registrarLog("ESTOQUE", `Novo item: ${nome} [${category}] - Compra: R$ ${preco_compra.toFixed(2)} / Venda: R$ ${preco.toFixed(2)}`);
                    e.target.reset();
                    buscarDados();
                } catch (err) {
                    console.error(err);
                }
            };

            const atualizarProduto = async (e) => {
                e.preventDefault();
                const nome = e.target.editNome.value;
                const preco_compra = parseFloat(e.target.editPrecoCompra.value) || 0;
                const preco = parseFloat(e.target.editPreco.value) || 0;
                const estoque = parseInt(e.target.editEstoque.value) || 0;
                const category = e.target.editCategoria.value;
                try {
                    await supabaseClient.from('produtos').update({ 
                        nome, 
                        preco_compra, 
                        preco, 
                        estoque, 
                        categoria: category 
                    }).eq('id', produtoEditando.id);
                    registrarLog("EDIÇÃO", `Alterou ${produtoEditando.nome} -> Compra: R$ ${preco_compra.toFixed(2)} / Venda: R$ ${preco.toFixed(2)} / Est: ${estoque} / Cat: ${category}`);
                    setProdutoEditando(null);
                    buscarDados();
                } catch (err) {
                    console.error(err);
                }
            };

            const removerProduto = async (id, nome) => {
                if (!confirm(`Deseja realmente deletar o produto "${nome}"?`)) return;
                try {
                    await supabaseClient.from('produtos').delete().eq('id', id);
                    registrarLog("EXCLUSÃO", `Deletou o produto: ${nome}`);
                    buscarDados();
                } catch (err) {
                    console.error(err);
                }
            };

            const adicionarNovoUsuario = async (e) => {
                e.preventDefault();
                const usuario = e.target.usuario.value.toLowerCase();
                const senha = e.target.senha.value;
                const nivel = e.target.nivel.value;
                try {
                    await supabaseClient.from('usuarios_gestao').insert([{ usuario, senha, nivel }]);
                    registrarLog("EQUIPE", `Novo membro: ${usuario}`);
                    e.target.reset();
                    buscarDados();
                } catch (err) {
                    console.error(err);
                }
            };

            const adicionarNovoGasto = async (e) => {
                e.preventDefault();
                const descricao = e.target.descricao.value.trim();
                const valor = parseFloat(e.target.valor.value) || 0;
                if (!descricao || valor <= 0) return;
                try {
                    const { error } = await supabaseClient.from('gastos').insert([{ descricao, valor }]);
                    if (error) throw error;
                    registrarLog("GASTO", `Lançou gasto: ${descricao} - R$ ${valor.toFixed(2)}`);
                    e.target.reset();
                    buscarDados();
                } catch (err) {
                    console.error(err);
                    alert("Erro ao lançar gasto.");
                }
            };

            const deletarItemPedido = async (itemId) => {
                try {
                    await supabaseClient.from('pedidos').delete().eq('id', itemId);
                    buscarDados();
                } catch (err) {
                    console.error(err);
                }
            };

            const salvarNovaQtdMesas = async (novaQtd) => {
                setQtdMesas(novaQtd);
                safeSetItem('jb_qtd_mesas', novaQtd);
                try {
                    await supabaseClient.from('configuracoes_sistema').update({ valor: String(novaQtd) }).eq('chave', 'qtd_mesas');
                    registrarLog("MESAS", `Alterou a quantidade total de mesas para ${novaQtd}`);
                    buscarDados();
                } catch (err) {
                    console.error(err);
                }
            };

            const abasDisponiveis = useMemo(() => {
                if (userLogado && userLogado.nivel === 'admin') {
                    return ['home', 'notas', 'estoque', 'equipe', 'logs', 'financeiro', 'gastos'];
                }
                return ['home'];
            }, [userLogado]);

            const totalParaReceber = useMemo(() => {
                return notas.reduce((acc, n) => acc + Number(n.valor || 0), 0);
            }, [notas]);
            const totalNotasAbertas = notas.length;

            const notasAgrupadas = useMemo(() => {
                const grupos = {};
                notas.forEach(n => {
                    const cliente = (n.cliente || "DESCONHECIDO").toUpperCase().trim();
                    if (!grupos[cliente]) {
                        grupos[cliente] = {
                            cliente,
                            total: 0,
                            notasOriginais: []
                        };
                    }
                    grupos[cliente].total += Number(n.valor || 0);
                    grupos[cliente].notasOriginais.push(n);
                });
                return Object.values(grupos).sort((a, b) => b.total - a.total);
            }, [notas]);
            const totalClientesPendentes = notasAgrupadas.length;

            const receberPagamentoCliente = async (grupo) => {
                const { cliente, total, notasOriginais } = grupo;
                const inputVal = prompt(
                    `Cliente: ${cliente}\nTotal Devido: R$ ${total.toFixed(2)}\n\nDigite o valor que o cliente está pagando:`, 
                    total.toFixed(2)
                );
                if (inputVal === null) return;

                const valorPago = parseFloat(inputVal);
                if (isNaN(valorPago) || valorPago <= 0) {
                    return alert("Por favor, insira um valor válido de pagamento.");
                }
                if (valorPago > total) {
                    return alert("O valor inserido é maior que o total que o cliente deve!");
                }

                try {
                    let restanteParaAbater = valorPago;
                    const notasOrdenadas = [...notesOriginais].sort((a, b) => a.id - b.id);

                    for (let n of notasOrdenadas) {
                        if (restanteParaAbater <= 0) break;
                        const valorNota = Number(n.valor || 0);
                        if (restanteParaAbater >= valorNota) {
                            await supabaseClient.from('notas_pendentes').update({ pago: true }).eq('id', n.id);
                            restanteParaAbater -= valorNota;
                        } else {
                            const novoValor = valorNota - restanteParaAbater;
                            await supabaseClient.from('notas_pendentes').update({ valor: novoValor }).eq('id', n.id);
                            restanteParaAbater = 0;
                        }
                    }

                    if (valorPago === total) {
                        await registrarLog("PAGO INTEGRAL", `${cliente}: Recebido total de R$ ${valorPago.toFixed(2)}`);
                    } else {
                        const restante = total - valorPago;
                        await registrarLog(
                            "PAGO PARCIAL", 
                            `${cliente}: Recebido R$ ${valorPago.toFixed(2)} de R$ ${total.toFixed(2)} (Ficou devendo: R$ ${restante.toFixed(2)})`
                        );
                    }

                    buscarDados();
                } catch (err) {
                    console.error(err);
                    alert("Ocorreu um erro ao processar o pagamento.");
                }
            };

            const logsFiltrados = useMemo(() => {
                if (!filtroUsuarioLog.trim()) return logs;
                return logs.filter(l => 
                    (l.usuario || '').toLowerCase().includes(filtroUsuarioLog.toLowerCase().trim())
                );
            }, [logs, filtroUsuarioLog]);

            const totalPaginasLog = useMemo(() => {
                return Math.ceil(logsFiltrados.length / logsPorPagina) || 1;
            }, [logsFiltrados]);
            const paginaLogValida = useMemo(() => {
                return Math.min(paginaLog, totalPaginasLog);
            }, [paginaLog, totalPaginasLog]);
            const logsPaginados = useMemo(() => {
                const inicio = (paginaLogValida - 1) * logsPorPagina;
                const fim = inicio + logsPorPagina;
                return logsFiltrados.slice(inicio, fim);
            }, [logsFiltrados, paginaLogValida]);

            const historicoFinanceiro = useMemo(() => {
                const dias = {};
                
                logs.forEach(l => {
                    if (!l.data) return;
                    const dataObj = new Date(l.data);
                    const dataFormatada = dataObj.toLocaleDateString('pt-BR');
                    
                    if (!dias[dataFormatada]) {
                        dias[dataFormatada] = {
                            data: dataFormatada,
                            dataObj: dataObj,
                            vendas: 0,
                            fiado: 0,
                            recebidoNotas: 0,
                            totalDinheiro: 0,
                            gastos: 0 
                        };
                    }
                    
                    const acao = (l.acao || '').toUpperCase();
                    const detalhes = (l.detalhes || '');
                    
                    const regexR = /R\$\s*([0-9.,]+)/i;
                    const match = detalhes.match(regexR);
                    const valor = match ? parseFloat(match[1].replace(',', '.')) : 0;

                    if (acao === 'VENDA') {
                        dias[dataFormatada].vendas += valor;
                    } else if (acao === 'FIADO') {
                        dias[dataFormatada].fiado += valor;
                    } else if (acao.includes('PAGO')) {
                        dias[dataFormatada].recebidoNotas += valor;
                    }
                });

                gastos.forEach(g => {
                    if (!g.data) return;
                    const dataFormatada = new Date(g.data).toLocaleDateString('pt-BR');
                    if (!dias[dataFormatada]) {
                        dias[dataFormatada] = {
                            data: dataFormatada,
                            dataObj: new Date(g.data),
                            vendas: 0,
                            fiado: 0,
                            recebidoNotas: 0,
                            totalDinheiro: 0,
                            gastos: 0
                        };
                    }
                    dias[dataFormatada].gastos += Number(g.valor || 0);
                });
                
                return Object.values(dias)
                    .map(d => ({
                        ...d,
                        totalDinheiro: d.vendas + d.recebidoNotas,
                        saldoLiquido: (d.vendas + d.recebidoNotas) - d.gastos 
                    }))
                    .sort((a, b) => b.dataObj - a.dataObj);
            }, [logs, gastos]);

            const faturamentoHoje = useMemo(() => {
                const hojeFormatado = new Date().toLocaleDateString('pt-BR');
                const hojeDados = historicoFinanceiro.find(d => d.data === hojeFormatado);
                
                const hojeString = new Date().toDateString();
                const totalGastosHoje = gastos
                    .filter(g => new Date(g.data).toDateString() === hojeString)

                    recebidoNotas: 0,

                    if (!meses[mesAno]) {
                        meses[mesAno] = {
                            mesAno,
                            total: 0,
                            itens: []

                    meses[mesAno].total += Number(g.valor || 0);

                        nome_produto: prod.nome,

                                                    <div>
                                                        <div className="font-black uppercase text-xs text-white">{g.descricao}</div>
                                                        <div className="text-[9px] font-bold text-slate-500 mt-0.5">{g.data ? new Date(g.data).toLocaleDateString('pt-BR') : ''}</div>
                                                    </div>
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-rose-400 font-black text-sm">R$ {Number(g.valor || 0).toFixed(2)}</span>
                                                        <button onClick={async () => { if(confirm(`Excluir despesa "${g.descricao}"?`)){ await supabaseClient.from('gastos').delete().eq('id', g.id); registrarLog("GASTO", `Excluiu despesa: ${g.descricao} - R$ ${Number(g.valor).toFixed(2)}`); buscarDados(); } }} className="text-slate-600 hover:text-red-500 font-bold text-xs p-1">✕</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {pagina === 'notas' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 gap-3 bg-slate-900 p-4 rounded-3xl border border-slate-800">
                                    <div className="flex flex-col justify-between border-r border-slate-800 pr-2">
                                        <div className="text-[9px] font-black uppercase text-slate-500 tracking-wider">TOTAL PARA RECEBER</div>
                                        <div className="text-2xl font-black text-green-500 mt-2">R$ {totalParaReceber.toFixed(2)}</div>
                                    </div>
                                    <div className="flex flex-col justify-between pl-2">
                                        <div className="text-[9px] font-black uppercase text-slate-500 tracking-wider">NOTAS EM ABERTO</div>
                                        <div className="text-xl font-black text-orange-500 mt-2">
                                            {totalNotasAbertas}
                                            <span className="text-[9px] font-bold text-slate-400 block mt-0.5">({totalClientesPendentes} Clientes)</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    {notasAgrupadas.map(g => (
                                        <div key={g.cliente} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                            <div>
                                                <div className="font-black uppercase text-xs text-white">{g.cliente}</div>
                                                <div className="text-green-500 font-black mt-0.5 text-base">R$ {g.total.toFixed(2)}</div>
                                                <div className="text-[8px] text-slate-500 uppercase mt-1 font-bold">
                                                    {g.notasOriginais.length} {g.notasOriginais.length === 1 ? 'Nota em aberto' : 'Notas acumuladas'}
                                                </div>
                                            </div>
                                            <button onClick={() => receberPagamentoCliente(g)} className="bg-green-600 p-3 rounded-xl text-[10px] font-black uppercase active:scale-95 transition-transform">
                                                Receber
                                            </button>
                                        </div>
                                    ))}
                                    {notasAgrupadas.length === 0 && (
                                        <div className="text-center text-slate-500 text-xs py-8 uppercase font-bold">Nenhum cliente pendente</div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-md p-4 border-t border-slate-800 flex gap-2 z-40 overflow-x-auto no-scrollbar">
                        {abasDisponiveis.map(p => (
                            <button key={p} onClick={() => setPagina(p)} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] uppercase transition-all ${pagina === p ? 'active-tab shadow-lg shadow-orange-600/30' : 'bg-slate-800 text-slate-500'}`}>
                                {p === 'home' ? '🪑 Mesas' : p === 'notas' ? '📋 Caderno Fiado' : p === 'estoque' ? '📦 Estoque' : p === 'equipe' ? '👥 Equipe' : p === 'logs' ? '📜 Logs' : p === 'financeiro' ? '📊 Caixa' : '📉 Despesas'}
                            </button>
                        ))}
                    </nav>

                    {idMesaAberta && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-sm z-[60] flex items-end">
                            <div className="bg-slate-900 w-full rounded-t-[40px] p-5 border-t border-slate-700 max-h-[90vh] flex flex-col">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-black text-orange-500 italic uppercase">Atendimento Mesa {idMesaAberta}</h2>
                                    <button onClick={() => { setIdMesaAberta(null); setBuscaProduto(''); setCategoriaSelecionada('Todos'); }} className="bg-slate-800 w-10 h-10 rounded-full font-bold">✕</button>
                                </div>

                                <div className="bg-slate-950 p-4 rounded-3xl mb-4 border border-slate-800 max-h-[22vh] overflow-y-auto no-scrollbar space-y-1.5">
                                    <div className="text-[10px] font-black text-slate-500 uppercase tracking-tight mb-1">Consumo Atual:</div>
                                    {mesaAtual && mesaAtual.itens.map(item => (
                                        <div key={item.id} className="flex justify-between items-center bg-slate-900 p-2.5 rounded-xl border border-slate-800/60">
                                            <span className="text-xs font-bold uppercase truncate max-w-[65%]">{item.nome_produto}</span>
                                            <div className="flex items-center gap-3">
                                                <span className="text-xs font-black text-orange-400">R$ {Number(item.preco_unidade).toFixed(2)}</span>
                                                <button onClick={() => deletarItemPedido(item.id)} className="text-red-500 font-bold text-xs p-1 hover:text-red-400">✕</button>
                                            </div>
                                        </div>
                                    ))}
                                    {(!mesaAtual || mesaAtual.itens.length === 0) && (
                                        <div className="text-slate-600 text-[10px] font-bold uppercase py-2 text-center">Nenhum item lançado nesta mesa</div>
                                    )}
                                </div>

                                <div className="flex justify-between items-center bg-slate-950 px-4 py-3 rounded-2xl mb-4 border border-slate-800">
                                    <span className="text-[10px] font-black text-slate-400 uppercase">Total da Mesa:</span>
                                    <span className="text-xl font-black text-green-500">R$ {(mesaAtual ? mesaAtual.total : 0).toFixed(2)}</span>
                                </div>

                                <div className="space-y-2 mb-4 select-none">
                                    <input value={buscaProduto} onChange={e => setBuscaProduto(e.target.value)} placeholder="🔍 BUSCAR PRODUTO..." className="w-full p-3.5 bg-slate-950 rounded-2xl text-xs font-bold uppercase outline-none border border-slate-800 text-white" />
                                    
                                    <div className="flex gap-1.5 overflow-x-auto no-scrollbar py-1">
                                        {categoriasAtendimento.map(cat => (
                                            <button key={cat.id} onClick={() => setCategoriaSelecionada(cat.id)} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase whitespace-nowrap border transition-all ${categoriaSelecionada === cat.id ? 'bg-orange-600 text-white border-orange-500 font-black' : 'bg-slate-950 text-slate-400 border-slate-800/80'}`}>
                                                {cat.emoji} {cat.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto no-scrollbar grid grid-cols-2 gap-2 mb-6 min-h-[20vh]">
                                    {produtos.filter(p => {
                                        const matchesCategory = categoriaSelecionada === 'Todos' || (p.categoria || 'Outros').toLowerCase() === categoriaSelecionada.toLowerCase();
                                        const matchesSearch = (p.nome || '').toLowerCase().includes(buscaProduto.toLowerCase());
                                        return matchesCategory && matchesSearch;
                                    }).map(p => (
                                        <button key={p.id} onClick={() => lancarItemMesa(p)} className="bg-slate-950 p-3 rounded-2xl border border-slate-800 text-left active:scale-95 transition-transform flex flex-col justify-between h-[85px]">
                                            <div className="font-black text-[11px] uppercase truncate w-full text-white">{p.nome}</div>
                                            <div className="w-full flex flex-col mt-1">
                                                <span className="text-xs font-black text-orange-500">R$ {Number(p.preco || 0).toFixed(2)}</span>
                                                <span className="text-[9px] font-bold text-slate-500 mt-0.5 uppercase">
                                                    Estoque: <span className={(p.estoque || 0) > 5 ? 'text-green-500' : 'text-red-500 font-black'}>{p.estoque || 0}</span>
                                                </span>
                                            </div>
                                        </button>
                                    ))}
                                    {produtos.filter(p => {
                                        const matchesCategory = categoriaSelecionada === 'Todos' || (p.categoria || 'Outros').toLowerCase() === categoriaSelecionada.toLowerCase();
                                        const matchesSearch = (p.nome || '').toLowerCase().includes(buscaProduto.toLowerCase());
                                        return matchesCategory && matchesSearch;
                                    }).length === 0 && (
                                        <div className="col-span-2 text-center text-slate-500 text-xs py-4 uppercase font-bold">Nenhum produto encontrado</div>
                                    )}
                                </div>
                                
                                <div className="grid grid-cols-3 gap-2">
                                    <button onClick={alterarApelido} className="bg-slate-700 p-4 rounded-2xl font-black uppercase text-[10px]">Apelido</button>
                                    <button onClick={registrarFiado} className="bg-orange-600 p-4 rounded-2xl font-black uppercase text-[10px]">Fiado</button>
                                    <button onClick={registrarPagamento} className="bg-red-600 p-4 rounded-2xl font-black uppercase text-[10px]">Pagar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
