<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JB ESPETO PRO - SISTEMA INTEGRAL</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; }
        .active-tab { background-color: #ea580c !important; color: white !important; }
        .status-ready { animation: pulse-green 1s infinite; background-color: #15803d !important; border-color: #ffffff !important; }
        @keyframes pulse-green { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Configuração Supabase
        const SUPABASE_URL = 'https://zpzjpkrglknnhoojglmv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwempwa3JnbGtubmhvb2pnbG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzY4NTUsImV4cCI6MjA5MzA1Mjg1NX0.6BV3CTuBjOXraXnswNBpZoapHF_NDV7P4O1ja_cVNEY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const App = () => {
            const [userLogado, setUserLogado] = useState(null);
            const [pagina, setPagina] = useState('home');
            const [mesas, setMesas] = useState(Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' })));
            const [produtos, setProdutos] = useState([]);
            const [notas, setNotas] = useState([]);
            const [logs, setLogs] = useState([]);
            const [pedidosProducao, setPedidosProducao] = useState([]);
            const [idMesaAberta, setIdMesaAberta] = useState(null);
            const [buscaProd, setBuscaProd] = useState("");

            // Alerta sonoro KDS
            const playNotif = () => {
                const audio = new AudioContext();
                const osc = audio.createOscillator();
                const g = audio.createGain();
                osc.connect(g); g.connect(audio.destination);
                osc.frequency.value = 660; g.gain.value = 0.1;
                osc.start(); osc.stop(audio.currentTime + 0.3);
            };

            const carregarTudo = useCallback(async () => {
                try {
                    const { data: pds } = await supabaseClient.from('produtos').select('*').order('nome');
                    setProdutos(pds || []);

                    const { data: ord } = await supabaseClient.from('pedidos').select('*');
                    const novasMesas = Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' }));
                    if (ord) {
                        ord.forEach(o => {
                            const mIdx = o.mesa - 1;
                            if (novasMesas[mIdx]) {
                                novasMesas[mIdx].itens.push(o);
                                novasMesas[mIdx].total += Number(o.preco_unidade);
                                if (o.apelido_mesa) novasMesas[mIdx].apelido = o.apelido_mesa;
                            }
                        });
                        setPedidosProducao(ord.filter(o => o.status !== 'entregue' && o.setor !== 'balcao'));
                    }
                    setMesas(novasMesas);

                    const { data: nts } = await supabaseClient.from('notas_pendentes').select('*').eq('pago', false);
                    setNotas(nts || []);

                    const { data: lg } = await supabaseClient.from('logs_sistema').select('*').order('data', { ascending: false }).limit(30);
                    setLogs(lg || []);
                } catch (err) { console.error("Erro ao carregar:", err); }
            }, []);

            useEffect(() => {
                const storageUser = localStorage.getItem('jb_user');
                if (storageUser) setUserLogado(JSON.parse(storageUser));
                carregarTudo();

                const channel = supabaseClient.channel('realtime_jb').on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, (payload) => {
                    if (payload.eventType === 'INSERT') playNotif();
                    carregarTudo();
                }).subscribe();

                return () => supabaseClient.removeChannel(channel);
            }, [carregarTudo]);

            const logAction = async (acao, detalhes) => {
                await supabaseClient.from('logs_sistema').insert([{ usuario: userLogado.usuario, acao, detalhes }]);
            };

            const handlePedido = async (prod) => {
                if (prod.estoque <= 0) return alert("Estoque esgotado!");
                const mesaAtual = mesas[idMesaAberta-1];
                let apelido = mesaAtual.apelido;
                if (!apelido) apelido = prompt("Nome do Cliente:") || `Mesa ${idMesaAberta}`;

                await supabaseClient.from('pedidos').insert([{
                    mesa: idMesaAberta, produto_nome: prod.nome, preco_unidade: prod.preco,
                    setor: prod.setor, status: 'pendente', apelido_mesa: apelido.toUpperCase()
                }]);
                await supabaseClient.from('produtos').update({ estoque: prod.estoque - 1 }).eq('id', prod.id);
                logAction("PEDIDO", `Adicionado ${prod.nome} na Mesa ${idMesaAberta}`);
                carregarTudo();
            };

            const mudarStatus = async (id, status, nomeProd) => {
                await supabaseClient.from('pedidos').update({ status }).eq('id', id);
                if (status === 'pronto') logAction("COZINHA", `${nomeProd} PRONTO`);
                carregarTudo();
            };

            const fecharMesa = async (metodo) => {
                const mesa = mesas[idMesaAberta-1];
                if (metodo === 'FIADO') {
                    await supabaseClient.from('notas_pendentes').insert([{ cliente: mesa.apelido, valor: mesa.total }]);
                }
                await supabaseClient.from('pedidos').delete().eq('mesa', idMesaAberta);
                logAction("FECHAMENTO", `Mesa ${idMesaAberta} fechada via ${metodo}`);
                setIdMesaAberta(null);
                carregarTudo();
            };

            if (!userLogado) return (
                <div className="h-screen flex items-center justify-center bg-slate-950 p-6">
                    <form onSubmit={(e) => {
                        e.preventDefault();
                        const u = e.target.u.value.toUpperCase();
                        const user = { usuario: u, nivel: u === 'ADMIN' ? 'admin' : 'garcon' };
                        setUserLogado(user);
                        localStorage.setItem('jb_user', JSON.stringify(user));
                    }} className="bg-slate-900 p-8 rounded-[40px] w-full max-w-sm border border-slate-800">
                        <h1 className="text-3xl font-black text-center mb-8 italic">JB <span className="text-orange-500">ESPETO</span></h1>
                        <input name="u" placeholder="NOME DE USUÁRIO" className="w-full p-4 mb-4 bg-slate-800 rounded-2xl outline-none border border-slate-700 font-bold" required />
                        <button className="w-full bg-orange-600 p-4 rounded-2xl font-black shadow-lg">ENTRAR</button>
                    </form>
                </div>
            );

            return (
                <div className="min-h-screen pb-32">
                    {/* Header Estilizado */}
                    <header className="p-5 flex justify-between items-center bg-slate-900/50 backdrop-blur-lg sticky top-0 z-50 border-b border-white/5">
                        <div className="font-black text-xl italic uppercase tracking-tighter">JB <span className="text-orange-500">PRO</span></div>
                        <div className="flex items-center gap-3">
                            <span className="text-[10px] font-black bg-slate-800 px-3 py-1 rounded-full">{userLogado.usuario}</span>
                            <button onClick={() => {localStorage.clear(); location.reload();}} className="text-red-500 font-black text-xs">SAIR</button>
                        </div>
                    </header>

                    <main className="p-4 max-w-lg mx-auto">
                        {/* 1. MÓDULO MESAS */}
                        {pagina === 'home' && (
                            <div className="grid grid-cols-2 gap-3">
                                {mesas.map(m => {
                                    const pronto = m.itens.some(i => i.status === 'pronto');
                                    return (
                                        <div key={m.id} onClick={() => setIdMesaAberta(m.id)} className={`p-5 rounded-[30px] border-2 transition-all ${pronto ? 'status-ready' : m.total > 0 ? 'bg-orange-600 border-orange-400' : 'bg-slate-900 border-slate-800'}`}>
                                            <div className="text-[10px] font-black opacity-60">MESA {m.id}</div>
                                            <div className="text-2xl font-black">R$ {m.total.toFixed(2)}</div>
                                            <div className="text-[9px] font-bold truncate mt-1 uppercase">{m.apelido || 'Vazia'}</div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* 2. MÓDULO COZINHA (KDS) */}
                        {pagina === 'kds' && (
                            <div className="space-y-3">
                                <h2 className="font-black text-orange-500 italic uppercase text-sm mb-4">Pedidos em Produção</h2>
                                {pedidosProducao.map(p => (
                                    <div key={p.id} className="bg-slate-900 p-5 rounded-[30px] border border-white/5 flex justify-between items-center">
                                        <div>
                                            <div className="flex gap-2 mb-1">
                                                <span className="bg-orange-600 text-[8px] px-2 py-0.5 rounded font-black uppercase">{p.setor}</span>
                                                <span className="font-black text-xs uppercase">Mesa {p.mesa}</span>
                                            </div>
                                            <div className="text-lg font-black leading-tight uppercase">{p.produto_nome}</div>
                                            <div className="text-[10px] text-slate-500 font-bold uppercase">{p.apelido_mesa}</div>
                                        </div>
                                        <div className="flex flex-col gap-2">
                                            {p.status === 'pendente' && <button onClick={() => mudarStatus(p.id, 'preparando', p.produto_nome)} className="bg-blue-600 p-3 rounded-2xl text-[10px] font-black uppercase">Aceitar</button>}
                                            {p.status === 'preparando' && <button onClick={() => mudarStatus(p.id, 'pronto', p.produto_nome)} className="bg-green-600 p-3 rounded-2xl text-[10px] font-black uppercase">Pronto</button>}
                                            {p.status === 'pronto' && <span className="text-green-500 font-black text-[9px] italic animate-pulse">Aguardando Retirada</span>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* 3. MÓDULO ESTOQUE COMPLETO */}
                        {pagina === 'estoque' && (
                            <div className="space-y-4">
                                {userLogado.nivel === 'admin' && (
                                    <form onSubmit={async (e) => {
                                        e.preventDefault();
                                        const f = e.target;
                                        await supabaseClient.from('produtos').insert([{
                                            nome: f.n.value.toUpperCase(), preco: f.p.value, estoque: f.e.value, setor: f.s.value
                                        }]);
                                        f.reset(); carregarTudo();
                                    }} className="bg-slate-900 p-6 rounded-[35px] border border-slate-800 space-y-3">
                                        <input name="n" placeholder="NOME DO PRODUTO" className="w-full bg-slate-800 p-4 rounded-2xl text-xs font-bold" required />
                                        <div className="flex gap-2">
                                            <input name="p" type="number" step="0.01" placeholder="PREÇO" className="w-full bg-slate-800 p-4 rounded-2xl text-xs font-bold" required />
                                            <input name="e" type="number" placeholder="QTD" className="w-full bg-slate-800 p-4 rounded-2xl text-xs font-bold" required />
                                        </div>
                                        <select name="s" className="w-full bg-slate-800 p-4 rounded-2xl text-xs font-bold appearance-none">
                                            <option value="cozinha">COZINHA</option>
                                            <option value="bar">BAR</option>
                                            <option value="churrasqueira">CHURRASQUEIRA</option>
                                        </select>
                                        <button className="w-full bg-white text-black p-4 rounded-2xl font-black uppercase text-xs">Adicionar ao Estoque</button>
                                    </form>
                                )}
                                <div className="space-y-2">
                                    {produtos.map(p => (
                                        <div key={p.id} className="bg-slate-900 p-4 rounded-2xl border border-white/5 flex justify-between items-center">
                                            <div>
                                                <div className="font-black text-sm uppercase">{p.nome}</div>
                                                <div className="text-[10px] font-bold text-slate-500 uppercase">{p.setor} • Estoque: {p.estoque}</div>
                                            </div>
                                            <div className="font-black text-orange-500">R$ {Number(p.preco).toFixed(2)}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 4. MÓDULO FIADOS/NOTAS */}
                        {pagina === 'financeiro' && (
                            <div className="space-y-3">
                                <div className="bg-orange-600 p-6 rounded-[35px] mb-4">
                                    <div className="text-[10px] font-black uppercase opacity-60">Total em Notas</div>
                                    <div className="text-4xl font-black">R$ {notas.reduce((a, b) => a + Number(b.valor), 0).toFixed(2)}</div>
                                </div>
                                {notas.map(n => (
                                    <div key={n.id} className="bg-slate-900 p-5 rounded-3xl border border-white/5 flex justify-between items-center">
                                        <div>
                                            <div className="font-black text-sm uppercase">{n.cliente}</div>
                                            <div className="text-[10px] text-slate-500 font-bold uppercase">{new Date(n.data).toLocaleDateString()}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="font-black text-white mb-2">R$ {Number(n.valor).toFixed(2)}</div>
                                            <button onClick={async () => {
                                                await supabaseClient.from('notas_pendentes').update({ pago: true }).eq('id', n.id);
                                                carregarTudo();
                                            }} className="bg-green-600 text-[8px] font-black px-3 py-1 rounded-full uppercase">Quitar</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Modal de Pedido (Garçom) */}
                    {idMesaAberta && (
                        <div className="fixed inset-0 bg-slate-950/98 z-[100] flex flex-col p-6 animate-in slide-in-from-bottom">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-3xl font-black italic">MESA {idMesaAberta}</h2>
                                <button onClick={() => setIdMesaAberta(null)} className="text-4xl">✕</button>
                            </div>

                            <div className="flex-1 overflow-y-auto no-scrollbar mb-6">
                                <div className="space-y-2 mb-8">
                                    {mesas[idMesaAberta-1].itens.map(it => (
                                        <div key={it.id} className={`p-4 rounded-2xl flex justify-between items-center ${it.status === 'pronto' ? 'bg-green-600' : 'bg-slate-900'}`}>
                                            <span className="font-black text-sm uppercase">{it.produto_nome}</span>
                                            {it.status === 'pronto' ? (
                                                <button onClick={() => mudarStatus(it.id, 'entregue', it.produto_nome)} className="bg-white text-green-700 px-3 py-1 rounded-lg font-black text-xs">ENTREGAR</button>
                                            ) : (
                                                <span className="text-[10px] font-bold opacity-50 uppercase">{it.status}</span>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <input onChange={(e) => setBuscaProd(e.target.value)} placeholder="BUSCAR ITEM..." className="w-full p-4 bg-slate-800 rounded-2xl mb-4 font-bold border border-slate-700" />
                                <div className="grid grid-cols-2 gap-2">
                                    {produtos.filter(p => p.nome.includes(buscaProd.toUpperCase())).map(p => (
                                        <button key={p.id} onClick={() => handlePedido(p)} className="bg-slate-900 p-4 rounded-2xl border border-white/5 text-left active:scale-95 transition-transform">
                                            <div className="text-[10px] font-black uppercase truncate">{p.nome}</div>
                                            <div className="text-orange-500 font-black text-xs">R$ {p.preco}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-2">
                                <button onClick={() => fecharMesa('DINHEIRO')} className="bg-green-600 p-4 rounded-2xl font-black text-[10px]">DINHEIRO</button>
                                <button onClick={() => fecharMesa('CARTÃO')} className="bg-blue-600 p-4 rounded-2xl font-black text-[10px]">CARTÃO</button>
                                <button onClick={() => fecharMesa('FIADO')} className="bg-orange-600 p-4 rounded-2xl font-black text-[10px]">FIADO</button>
                            </div>
                        </div>
                    )}

                    {/* Nav Navegação Inferior */}
                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-slate-900/90 backdrop-blur-2xl p-2 rounded-[32px] border border-white/10 flex justify-around gap-1 z-50">
                        <button onClick={() => setPagina('home')} className={`flex-1 py-4 rounded-[26px] text-[10px] font-black uppercase ${pagina === 'home' ? 'active-tab' : 'text-slate-500'}`}>Mesas</button>
                        <button onClick={() => setPagina('kds')} className={`flex-1 py-4 rounded-[26px] text-[10px] font-black uppercase flex flex-col items-center relative ${pagina === 'kds' ? 'active-tab' : 'text-slate-500'}`}>
                            Cozinha
                            {pedidosProducao.filter(x => x.status === 'pendente').length > 0 && <span className="absolute top-2 right-4 w-2 h-2 bg-red-500 rounded-full"></span>}
                        </button>
                        <button onClick={() => setPagina('estoque')} className={`flex-1 py-4 rounded-[26px] text-[10px] font-black uppercase ${pagina === 'estoque' ? 'active-tab' : 'text-slate-500'}`}>Estoque</button>
                        <button onClick={() => setPagina('financeiro')} className={`flex-1 py-4 rounded-[26px] text-[10px] font-black uppercase ${pagina === 'financeiro' ? 'active-tab' : 'text-slate-500'}`}>Notas</button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
