<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JB ESPETO - GESTÃO PRO</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes pulse-red { 0%, 100% { background-color: #991b1b; } 50% { background-color: #ef4444; } }
        .animate-alert { animation: pulse-red 1.5s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://zpzjpkrglknnhoojglmv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwempwa3JnbGtubmhvb2pnbG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzY4NTUsImV4cCI6MjA5MzA1Mjg1NX0.6BV3CTuBjOXraXnswNBpZoapHF_NDV7P4O1ja_cVNEY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const App = () => {
            const [userLogado, setUserLogado] = useState(null);
            const [pagina, setPagina] = useState('home');
            const [mesas, setMesas] = useState(Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' })));
            const [produtos, setProdutos] = useState([]);
            const [notas, setNotas] = useState([]);
            const [logs, setLogs] = useState([]);
            const [equipe, setEquipe] = useState([]);
            const [idMesaAberta, setIdMesaAberta] = useState(null);
            const [carregando, setCarregando] = useState(true);

            useEffect(() => {
                const sessao = localStorage.getItem('jb_user_data');
                if (sessao) setUserLogado(JSON.parse(sessao));
                buscarDados();
                const timer = setInterval(buscarDados, 5000);
                return () => clearInterval(timer);
            }, []);

            async function buscarDados() {
                try {
                    const { data: prods } = await supabaseClient.from('produtos').select('*').order('nome');
                    if (prods) setProdutos(prods);

                    const { data: pedidos } = await supabaseClient.from('pedidos').select('*');
                    const novasMesas = Array.from({ length: 12 }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' }));
                    if (pedidos) {
                        pedidos.forEach(p => {
                            const idx = p.mesa - 1;
                            if (novasMesas[idx]) {
                                novasMesas[idx].itens.push(p);
                                novasMesas[idx].total += p.preco_unidade;
                                if (p.apelido_mesa) novasMesas[idx].apelido = p.apelido_mesa;
                            }
                        });
                    }
                    setMesas(novasMesas);

                    const { data: nts } = await supabaseClient.from('notas_pendentes').select('*').eq('pago', false).order('data', { ascending: false });
                    if (nts) setNotas(nts);

                    if (userLogado?.nivel === 'admin') {
                        const { data: lg } = await supabaseClient.from('logs_sistema').select('*').order('data', { ascending: false }).limit(50);
                        if (lg) setLogs(lg);
                        const { data: eq } = await supabaseClient.from('usuarios_gestao').select('*').order('usuario');
                        if (eq) setEquipe(eq);
                    }
                } catch (err) { console.error(err); }
                setCarregando(false);
            }

            async function registrarLog(acao, detalhes, financeiro = { entrada: 0, custo: 0 }) {
                if (!userLogado) return;
                await supabaseClient.from('logs_sistema').insert([{
                    usuario: userLogado.usuario,
                    acao,
                    detalhes,
                    valor_entrada: financeiro.entrada,
                    valor_custo: financeiro.custo
                }]);
            }

            const realizarLogin = async (e) => {
                e.preventDefault();
                const u = e.target.usuario.value.toLowerCase();
                const p = e.target.senha.value;
                const { data } = await supabaseClient.from('usuarios_gestao').select('*').eq('usuario', u).eq('senha', p).single();
                if (data) {
                    setUserLogado(data);
                    localStorage.setItem('jb_user_data', JSON.stringify(data));
                } else { alert("Acesso negado!"); }
            };

            const sair = () => {
                localStorage.removeItem('jb_user_data');
                setUserLogado(null);
            };

            // LÓGICA DE RELATÓRIO
            const calcularFinanceiro = () => {
                const resumo = logs.reduce((acc, log) => {
                    acc.entradas += (log.valor_entrada || 0);
                    acc.custos += (log.valor_custo || 0);
                    return acc;
                }, { entradas: 0, custos: 0 });
                return { ...resumo, lucro: resumo.entradas - resumo.custos };
            };

            async function handleLimparMesa(id) {
                const mesa = mesas.find(m => m.id === id);
                if (confirm(`Finalizar e Limpar Mesa ${id}?`)) {
                    const custoTotal = mesa.itens.reduce((acc, item) => {
                        const p = produtos.find(prod => prod.nome === item.produto_nome);
                        return acc + (p ? (p.preco_custo || 0) : 0);
                    }, 0);

                    const detalhesLog = `Mesa ${id} finalizada. Itens: ${mesa.itens.map(i => i.produto_nome).join(", ")}`;
                    await registrarLog("VENDA MESA", detalhesLog, { entrada: mesa.total, custo: custoTotal });
                    await supabaseClient.from('pedidos').delete().eq('mesa', id);
                    setIdMesaAberta(null);
                    buscarDados();
                }
            }

            // ... (Demais funções de equipe e notas permanecem as mesmas, apenas atualizando logs)

            if (!userLogado) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-950 p-6">
                        <form onSubmit={realizarLogin} className="w-full max-w-sm bg-slate-900 p-8 rounded-[40px] border border-slate-800">
                            <h1 className="text-4xl font-black text-center text-white mb-8 italic underline decoration-orange-500 underline-offset-8">JB ESPETO</h1>
                            <input name="usuario" placeholder="Usuário" className="w-full p-4 mb-4 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700" required />
                            <input name="senha" type="password" placeholder="Senha" className="w-full p-4 mb-6 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700" required />
                            <button className="w-full bg-orange-600 text-white p-4 rounded-2xl font-black uppercase">Entrar</button>
                        </form>
                    </div>
                );
            }

            const financeiro = calcularFinanceiro();

            return (
                <div className="min-h-screen pb-32">
                    <header className="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
                        <div>
                            <h1 className="font-black italic text-xl uppercase">JB <span className="text-orange-500">Espeto</span></h1>
                            <span className="text-[8px] font-bold bg-orange-600 text-white px-2 py-0.5 rounded uppercase">{userLogado.nivel}</span>
                        </div>
                        <button onClick={sair} className="text-[10px] font-black text-red-500 bg-red-500/10 px-3 py-2 rounded-lg border border-red-500/20">SAIR</button>
                    </header>

                    <main className="p-4">
                        {pagina === 'home' && (
                            <div className="grid grid-cols-2 gap-3">
                                {mesas.map(m => (
                                    <div key={m.id} onClick={() => setIdMesaAberta(m.id)} className={`p-4 rounded-2xl border-2 transition-all ${m.total > 0 ? 'bg-orange-600 border-orange-400' : 'bg-slate-800 border-slate-700 opacity-60'}`}>
                                        <div className="text-[10px] font-black uppercase text-white/70">Mesa {m.id}</div>
                                        <div className="text-xl font-black text-white">R$ {m.total.toFixed(2)}</div>
                                        {m.apelido && <div className="text-[9px] bg-black/30 p-1 mt-1 rounded font-bold uppercase truncate italic">{m.apelido}</div>}
                                    </div>
                                ))}
                            </div>
                        )}

                        {pagina === 'relatorio' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                <h2 className="text-2xl font-black text-orange-500 italic uppercase">Financeiro (Últimos Logs)</h2>
                                <div className="grid grid-cols-1 gap-3">
                                    <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                                        <div className="text-slate-500 font-black text-[10px] uppercase mb-1">Total Entradas</div>
                                        <div className="text-3xl font-black text-green-500">R$ {financeiro.entradas.toFixed(2)}</div>
                                    </div>
                                    <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                                        <div className="text-slate-500 font-black text-[10px] uppercase mb-1">Custo dos Produtos</div>
                                        <div className="text-3xl font-black text-red-500">R$ {financeiro.custos.toFixed(2)}</div>
                                    </div>
                                    <div className="bg-orange-600 p-6 rounded-3xl border border-orange-400 shadow-lg shadow-orange-600/20">
                                        <div className="text-white/70 font-black text-[10px] uppercase mb-1">Lucro Bruto Estimado</div>
                                        <div className="text-4xl font-black text-white">R$ {financeiro.lucro.toFixed(2)}</div>
                                    </div>
                                </div>
                                
                                <div className="mt-8">
                                    <h3 className="text-xs font-black text-slate-500 uppercase mb-4 px-2">Desempenho por Item</h3>
                                    <div className="bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden">
                                        {produtos.map(p => {
                                            const lucroUnitario = p.preco - (p.preco_custo || 0);
                                            return (
                                                <div key={p.id} className="p-4 border-b border-slate-800 flex justify-between items-center">
                                                    <span className="font-black text-sm uppercase">{p.nome}</span>
                                                    <div className="text-right">
                                                        <div className="text-[10px] text-green-500 font-bold">Lucro/un: R${lucroUnitario.toFixed(2)}</div>
                                                        <div className="text-[8px] text-slate-500 font-bold">Margem: {((lucroUnitario/p.preco)*100).toFixed(0)}%</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {pagina === 'estoque' && (
                            <div className="space-y-6">
                                {userLogado.nivel === 'admin' && (
                                    <form onSubmit={async (e) => {
                                        e.preventDefault();
                                        const n = e.target.n.value;
                                        const pc = parseFloat(e.target.pc.value);
                                        const pv = parseFloat(e.target.pv.value);
                                        await registrarLog("CADASTRO", `Produto: ${n}`, { entrada: 0, custo: 0 });
                                        await supabaseClient.from('produtos').insert([{ 
                                            nome: n, 
                                            preco: pv, 
                                            preco_custo: pc,
                                            estoque: parseInt(e.target.e.value) 
                                        }]);
                                        e.target.reset(); buscarDados();
                                    }} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3">
                                        <h2 className="text-[11px] font-black text-orange-500 uppercase px-1">Novo Item com Custo</h2>
                                        <input name="n" placeholder="Nome do Produto" className="w-full p-4 bg-slate-800 rounded-xl outline-none border border-slate-700 text-sm font-bold" required />
                                        <div className="grid grid-cols-3 gap-2">
                                            <input name="pc" step="0.01" type="number" placeholder="Custo R$" className="p-4 bg-slate-800 rounded-xl border border-slate-700 text-[10px] font-bold text-red-400" required />
                                            <input name="pv" step="0.01" type="number" placeholder="Venda R$" className="p-4 bg-slate-800 rounded-xl border border-slate-700 text-[10px] font-bold text-green-400" required />
                                            <input name="e" type="number" placeholder="Qtd" className="p-4 bg-slate-800 rounded-xl border border-slate-700 text-[10px] font-bold" required />
                                        </div>
                                        <button className="w-full bg-orange-600 p-4 rounded-xl font-black uppercase text-xs">Salvar no Inventário</button>
                                    </form>
                                )}
                                
                                <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800">
                                    <h2 className="text-[10px] font-black text-slate-500 uppercase mb-4 px-2">Gestão de Preços e Estoque</h2>
                                    {produtos.map(p => (
                                        <div key={p.id} className="py-4 border-b border-slate-800 last:border-0">
                                            <div className="flex justify-between items-start mb-2">
                                                <div className="font-black text-sm uppercase">{p.nome}</div>
                                                <div className="text-right">
                                                    <span className="text-red-500 text-[10px] font-bold block">Custo: R$ {p.preco_custo?.toFixed(2)}</span>
                                                    <span className="text-green-500 text-[10px] font-bold block">Venda: R$ {p.preco.toFixed(2)}</span>
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                <input type="number" defaultValue={p.estoque} onBlur={async (e) => {
                                                    if(userLogado.nivel === 'admin') {
                                                        await supabaseClient.from('produtos').update({ estoque: parseInt(e.target.value) }).eq('id', p.id);
                                                        buscarDados();
                                                    }
                                                }} className="flex-1 bg-slate-800 p-2 rounded-lg text-center font-black text-xs border border-slate-700" />
                                                <button onClick={async () => {
                                                    const novoCusto = prompt("Novo Preço de Custo:", p.preco_custo);
                                                    if(novoCusto) {
                                                        await supabaseClient.from('produtos').update({ preco_custo: parseFloat(novoCusto) }).eq('id', p.id);
                                                        buscarDados();
                                                    }
                                                }} className="bg-slate-800 px-3 rounded-lg text-[9px] font-black uppercase border border-slate-700">Ajustar Custo</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        
                        {/* Outras abas (equipe, logs, notas) permanecem aqui... */}
                    </main>

                    <nav className="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-md p-4 border-t border-slate-800 flex gap-2 z-40 overflow-x-auto no-scrollbar">
                        <button onClick={() => setPagina('home')} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] uppercase ${pagina === 'home' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>Mesas</button>
                        <button onClick={() => setPagina('notas')} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] uppercase ${pagina === 'notas' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>Notas</button>
                        <button onClick={() => setPagina('estoque')} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] uppercase ${pagina === 'estoque' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>Estoque</button>
                        {userLogado.nivel === 'admin' && (
                            <>
                            <button onClick={() => setPagina('relatorio')} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] uppercase ${pagina === 'relatorio' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>💰 Lucro</button>
                            <button onClick={() => setPagina('equipe')} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] uppercase ${pagina === 'equipe' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>Equipe</button>
                            <button onClick={() => setPagina('logs')} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] uppercase ${pagina === 'logs' ? 'bg-orange-600 text-white' : 'bg-slate-800 text-slate-500'}`}>Logs</button>
                            </>
                        )}
                    </nav>
                    
                    {/* Modal de Mesa Aberta permanece o mesmo */}
                    {idMesaAberta && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-sm z-[60] flex items-end">
                            <div className="bg-slate-900 w-full rounded-t-[40px] p-6 border-t border-slate-700 max-h-[95vh] flex flex-col">
                                <div className="flex justify-between items-start mb-6">
                                    <h2 className="text-3xl font-black text-orange-500 uppercase italic">Mesa {idMesaAberta}</h2>
                                    <button onClick={() => setIdMesaAberta(null)} className="bg-slate-800 text-white w-10 h-10 rounded-full font-bold">✕</button>
                                </div>
                                <div className="bg-slate-950 p-5 rounded-3xl mb-6 border border-slate-800 shadow-inner">
                                    <div className="max-h-32 overflow-y-auto no-scrollbar mb-4 space-y-2">
                                        {mesaAtual.itens.map((it, i) => (
                                            <div key={i} className="flex justify-between text-[11px] font-bold uppercase text-slate-400 italic">
                                                <span>{it.produto_nome}</span>
                                                <div className="flex gap-4">
                                                    <span>R${it.preco_unidade.toFixed(2)}</span>
                                                    <button onClick={async () => { await supabaseClient.from('pedidos').delete().eq('id', it.id); buscarDados(); }} className="text-red-500 font-black px-1">X</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="text-right text-3xl font-black text-white border-t border-slate-800 pt-3">R$ {mesaAtual.total.toFixed(2)}</div>
                                </div>
                                <div className="flex-1 overflow-y-auto no-scrollbar grid grid-cols-2 gap-2 mb-6">
                                    {produtos.map(p => (
                                        <button key={p.id} onClick={async () => {
                                            if (p.estoque <= 0) return alert("Sem estoque!");
                                            await supabaseClient.from('pedidos').insert([{ mesa: idMesaAberta, produto_nome: p.nome, preco_unidade: p.preco, apelido_mesa: mesaAtual.apelido }]);
                                            await supabaseClient.from('produtos').update({ estoque: p.estoque - 1 }).eq('id', p.id);
                                            buscarDados();
                                        }} className="p-4 bg-slate-800 rounded-2xl text-left border border-slate-700 active:scale-95 transition-all">
                                            <div className="text-[10px] font-black text-slate-500 uppercase truncate mb-1">{p.nome}</div>
                                            <div className="font-black text-white text-base">R$ {p.preco.toFixed(2)}</div>
                                            <div className={`text-[8px] font-black mt-2 ${p.estoque <= 5 ? 'text-red-500 animate-pulse' : 'text-slate-500'}`}>EST: {p.estoque}</div>
                                        </button>
                                    ))}
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => {/* Fiado ajustado com log de custo */}} className="bg-orange-600 p-5 rounded-2xl font-black uppercase text-[11px]">Fiado</button>
                                    <button onClick={() => handleLimparMesa(idMesaAberta)} className="bg-red-600 p-5 rounded-2xl font-black uppercase text-[11px]">Limpar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
