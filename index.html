<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JB ESPETO - GESTÃO TOTAL</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { background-color: #ea580c !important; color: white !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        const SUPABASE_URL = 'https://zpzjpkrglknnhoojglmv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwempwa3JnbGtubmhvb2pnbG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzY4NTUsImV4cCI6MjA5MzA1Mjg1NX0.6BV3CTuBjOXraXnswNBpZoapHF_NDV7P4O1ja_cVNEY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Funções seguras de acesso ao LocalStorage (evita tela preta por bloqueios de privacidade)
        const safeGetItem = (key, fallback) => {
            try {
                const val = localStorage.getItem(key);
                return val !== null ? val : fallback;
            } catch (e) {
                return fallback;
            }
        };

        const safeSetItem = (key, value) => {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                console.warn("Armazenamento local indisponível:", e);
            }
        };

        const safeRemoveItem = (key) => {
            try {
                localStorage.removeItem(key);
            } catch (e) {}
        };

        // Função auxiliar para obter cor do badge de logs
        const obterBadgeAcao = (acao) => {
            const acaoLimpa = (acao || '').toUpperCase();
            if (acaoLimpa.includes('EXCLUSÃO') || acaoLimpa.includes('REMOVE') || acaoLimpa.includes('DELET')) {
                return 'bg-red-500/20 text-red-400 border border-red-500/30';
            }
            if (acaoLimpa.includes('EDIÇÃO') || acaoLimpa.includes('EDIT')) {
                return 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
            }
            if (acaoLimpa.includes('FIADO')) {
                return 'bg-yellow-500/20 text-yellow-500 border border-yellow-500/30';
            }
            if (acaoLimpa.includes('PAGO') || acaoLimpa.includes('VENDA') || acaoLimpa.includes('RECEB')) {
                return 'bg-green-500/20 text-green-400 border border-green-500/30';
            }
            return 'bg-slate-700/50 text-slate-300 border border-slate-600/30';
        };

        // Função auxiliar para obter cor do badge de etiquetas dos produtos
        const obterCorCategoria = (cat) => {
            const c = (cat || '').toUpperCase();
            switch (c) {
                case 'CERVEJA': return 'bg-amber-500/20 text-amber-400 border border-amber-500/30';
                case 'BAR': return 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
                case 'DOSE': return 'bg-purple-500/20 text-purple-400 border border-purple-500/30';
                case 'ESPETO': return 'bg-rose-500/20 text-rose-400 border border-rose-500/30';
                case 'COZINHA': return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                default: return 'bg-slate-700/50 text-slate-400 border border-slate-600/30';
            }
        };

        const App = () => {
            const [userLogado, setUserLogado] = useState(null);
            const [pagina, setPagina] = useState('home');
            
            // Inicialização segura de mesas
            const [qtdMesas, setQtdMesas] = useState(() => {
                const num = Number(safeGetItem('jb_qtd_mesas', '12'));
                return (num && num > 0) ? num : 12;
            });
            const [mesas, setMesas] = useState(() => {
                const num = Number(safeGetItem('jb_qtd_mesas', '12'));
                const length = (num && num > 0) ? num : 12;
                return Array.from({ length }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' }));
            });

            const [produtos, setProdutos] = useState([]);
            const [notas, setNotas] = useState([]);
            const [logs, setLogs] = useState([]);
            const [equipe, setEquipe] = useState([]);
            const [idMesaAberta, setIdMesaAberta] = useState(null);
            const [buscaProduto, setBuscaProduto] = useState('');
            const [produtoEditando, setProdutoEditando] = useState(null); // Estado para controlar o modal de edição de estoque

            // Estados adicionais para filtro e paginação de Logs
            const [filtroUsuarioLog, setFiltroUsuarioLog] = useState('');
            const [paginaLog, setPaginaLog] = useState(1);
            const logsPorPagina = 30;

            const buscarDados = useCallback(async () => {
                try {
                    const { data: prods } = await supabaseClient.from('produtos').select('*').order('nome');
                    if (prods) setProdutos(prods);

                    const { data: pedidos } = await supabaseClient.from('pedidos').select('*');
                    const novasMesas = Array.from({ length: qtdMesas }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' }));
                    if (pedidos) {
                        pedidos.forEach(p => {
                            const idx = p.mesa - 1;
                            if (novasMesas[idx]) {
                                novasMesas[idx].itens.push(p);
                                novasMesas[idx].total += Number(p.preco_unidade);
                                if (p.apelido_mesa) novasMesas[idx].apelido = p.apelido_mesa;
                            }
                        });
                    }
                    setMesas(novasMesas);

                    const { data: nts } = await supabaseClient.from('notas_pendentes').select('*').eq('pago', false).order('data', { ascending: false });
                    if (nts) setNotas(nts);

                    const { data: lg } = await supabaseClient.from('logs_sistema').select('*').order('data', { ascending: false }).limit(1000);
                    if (lg) setLogs(lg);

                    const { data: eq } = await supabaseClient.from('usuarios_gestao').select('id, usuario, nivel').order('usuario');
                    if (eq) setEquipe(eq);
                } catch (e) { console.error(e); }
            }, [qtdMesas]);

            useEffect(() => {
                const sessao = safeGetItem('jb_user_data', null);
                if (sessao) {
                    try {
                        setUserLogado(JSON.parse(sessao));
                    } catch (err) {
                        safeRemoveItem('jb_user_data');
                    }
                }
                buscarDados();
                const t = setInterval(buscarDados, 5000);
                return () => clearInterval(t);
            }, [buscarDados]);

            // Redireciona o usuário para a página Home caso ele não seja Admin e tente acessar outra aba
            useEffect(() => {
                if (userLogado && userLogado.nivel !== 'admin' && pagina !== 'home') {
                    setPagina('home');
                }
            }, [userLogado, pagina]);

            const registrarLog = async (acao, detalhes) => {
                if(!userLogado) return;
                await supabaseClient.from('logs_sistema').insert([{ usuario: userLogado.usuario, acao, detalhes }]);
                buscarDados();
            };

            // ---- DEFINIÇÃO DE ABAS DISPONÍVEIS CONFORME NÍVEL DE ACESSO ----
            const abasDisponiveis = useMemo(() => {
                if (userLogado && userLogado.nivel === 'admin') {
                    return ['home', 'notas', 'estoque', 'equipe', 'logs', 'financeiro'];
                }
                return ['home']; // Atendentes visualizam somente a aba Mesas
            }, [userLogado]);

            // ---- LÓGICA E DADOS DE NOTAS AGRUPADAS ----
            const totalParaReceber = useMemo(() => {
                return notas.reduce((acc, n) => acc + Number(n.valor || 0), 0);
            }, [notas]);

            const totalNotasAbertas = notas.length;

            const notasAgrupadas = useMemo(() => {
                const grupos = {};
                notas.forEach(n => {
                    const cliente = (n.cliente || "DESCONHECIDO").toUpperCase().trim();
                    if (!grupos[cliente]) {
                        grupos[cliente] = {
                            cliente,
                            total: 0,
                            notasOriginais: []
                        };
                    }
                    grupos[cliente].total += Number(n.valor || 0);
                    grupos[cliente].notasOriginais.push(n);
                });
                return Object.values(grupos).sort((a, b) => b.total - a.total);
            }, [notas]);

            const totalClientesPendentes = notasAgrupadas.length;

            const receberPagamentoCliente = async (grupo) => {
                const { cliente, total, notasOriginais } = grupo;
                const inputVal = prompt(
                    `Cliente: ${cliente}\nTotal Devido: R$ ${total.toFixed(2)}\n\nDigite o valor que o cliente está pagando:`, 
                    total.toFixed(2)
                );
                
                if (inputVal === null) return; // Cancelou

                const valorPago = parseFloat(inputVal);
                if (isNaN(valorPago) || valorPago <= 0) {
                    return alert("Por favor, insira um valor válido de pagamento.");
                }
                if (valorPago > total) {
                    return alert("O valor inserido é maior que o total que o cliente deve!");
                }

                try {
                    let restanteParaAbater = valorPago;
                    const notasOrdenadas = [...notasOriginais].sort((a, b) => a.id - b.id);

                    for (let n of notasOrdenadas) {
                        if (restanteParaAbater <= 0) break;

                        const valorNota = Number(n.valor || 0);
                        if (restanteParaAbater >= valorNota) {
                            await supabaseClient.from('notas_pendentes').update({ pago: true }).eq('id', n.id);
                            restanteParaAbater -= valorNota;
                        } else {
                            const novoValor = valorNota - restanteParaAbater;
                            await supabaseClient.from('notas_pendentes').update({ valor: novoValor }).eq('id', n.id);
                            restanteParaAbater = 0;
                        }
                    }

                    if (valorPago === total) {
                        await registrarLog("PAGO INTEGRAL", `${cliente}: Recebido total de R$ ${valorPago.toFixed(2)}`);
                    } else {
                        const restante = total - valorPago;
                        await registrarLog(
                            "PAGO PARCIAL", 
                            `${cliente}: Recebido R$ ${valorPago.toFixed(2)} de R$ ${total.toFixed(2)} (Ficou devendo: R$ ${restante.toFixed(2)})`
                        );
                    }

                    buscarDados();
                } catch (err) {
                    console.error(err);
                    alert("Ocorreu um erro ao processar o pagamento.");
                }
            };

            // ---- LÓGICA DE FILTRAGEM E PAGINAÇÃO DE LOGS ----
            const logsFiltrados = useMemo(() => {
                if (!filtroUsuarioLog.trim()) return logs;
                return logs.filter(l => 
                    (l.usuario || '').toLowerCase().includes(filtroUsuarioLog.toLowerCase().trim())
                );
            }, [logs, filtroUsuarioLog]);

            const totalPaginasLog = useMemo(() => {
                return Math.ceil(logsFiltrados.length / logsPorPagina) || 1;
            }, [logsFiltrados]);

            const paginaLogValida = useMemo(() => {
                return Math.min(paginaLog, totalPaginasLog);
            }, [paginaLog, totalPaginasLog]);

            const logsPaginados = useMemo(() => {
                const inicio = (paginaLogValida - 1) * logsPorPagina;
                const fim = inicio + logsPorPagina;
                return logsFiltrados.slice(inicio, fim);
            }, [logsFiltrados, paginaLogValida]);

            // ---- RELATÓRIO / HISTÓRICO FINANCEIRO AGRUPADO POR DIAS ----
            const historicoFinanceiro = useMemo(() => {
                const dias = {};
                
                logs.forEach(l => {
                    if (!l.data) return;
                    const dataObj = new Date(l.data);
                    const dataFormatada = dataObj.toLocaleDateString('pt-BR');
                    
                    if (!dias[dataFormatada]) {
                        dias[dataFormatada] = {
                            data: dataFormatada,
                            dataObj: dataObj,
                            vendas: 0,
                            fiado: 0,
                            recebidoNotas: 0,
                            totalDinheiro: 0
                        };
                    }
                    
                    const acao = (l.acao || '').toUpperCase();
                    const detalhes = (l.detalhes || '');
                    
                    const regexR = /R\$\s*([0-9.,]+)/i;
                    const match = detalhes.match(regexR);
                    const valor = match ? parseFloat(match[1].replace(',', '.')) : 0;
                    
                    if (acao === 'VENDA') {
                        dias[dataFormatada].vendas += valor;
                    } else if (acao === 'FIADO') {
                        dias[dataFormatada].fiado += valor;
                    } else if (acao.includes('PAGO')) {
                        dias[dataFormatada].recebidoNotas += valor;
                    }
                });
                
                return Object.values(dias)
                    .map(d => ({
                        ...d,
                        totalDinheiro: d.vendas + d.recebidoNotas
                    }))
                    .sort((a, b) => b.dataObj - a.dataObj);
            }, [logs]);

            const faturamentoHoje = useMemo(() => {
                const hojeFormatado = new Date().toLocaleDateString('pt-BR');
                const hojeDados = historicoFinanceiro.find(d => d.data === hojeFormatado);
                return hojeDados || {
                    data: hojeFormatado,
                    vendas: 0,
                    fiado: 0,
                    recebidoNotas: 0,
                    totalDinheiro: 0
                };
            }, [historicoFinanceiro]);


            // ---- AÇÕES DE PRODUTO NA MESA ----
            const adicionarProdutoMesa = async (p) => {
                if (p.estoque <= 0) return alert("Sem estoque!");
                try {
                    const mesaAtual = mesas[idMesaAberta - 1];
                    const apelido = mesaAtual ? (mesaAtual.apelido || '') : '';
                    await supabaseClient.from('pedidos').insert([{ 
                        mesa: idMesaAberta, 
                        produto_nome: p.nome, 
                        preco_unidade: p.preco, 
                        apelido_mesa: apelido 
                    }]);
                    await supabaseClient.from('produtos').update({ estoque: p.estoque - 1 }).eq('id', p.id);
                    buscarDados();
                } catch (err) {
                    console.error(err);
                }
            };

            const alterarApelido = async () => {
                const mesaAtual = mesas[idMesaAberta - 1];
                const apelidoAtual = mesaAtual ? (mesaAtual.apelido || '') : '';
                const ap = prompt("Nome/Apelido:", apelidoAtual);
                if (ap !== null) {
                    await supabaseClient.from('pedidos').update({ apelido_mesa: ap }).eq('mesa', idMesaAberta);
                    buscarDados();
                }
            };

            const registrarFiado = async () => {
                const mesaAtual = mesas[idMesaAberta - 1];
                const apelidoAtual = mesaAtual ? (mesaAtual.apelido || '') : '';
                const clie = prompt("Cliente Fiado:", apelidoAtual);
                if (clie) {
                    const totalMesa = mesaAtual ? mesaAtual.total : 0;
                    await supabaseClient.from('notas_pendentes').insert([{ cliente: clie.toUpperCase(), valor: totalMesa }]);
                    await registrarLog("FIADO", `${clie}: R$ ${totalMesa.toFixed(2)}`);
                    await supabaseClient.from('pedidos').delete().eq('mesa', idMesaAberta);
                    setIdMesaAberta(null);
                    setBuscaProduto('');
                }
            };

            const registrarPagamento = async () => {
                if (confirm("Confirmar pagamento?")) {
                    const mesaAtual = mesas[idMesaAberta - 1];
                    const totalMesa = mesaAtual ? mesaAtual.total : 0;
                    await registrarLog("VENDA", `Mesa ${idMesaAberta}: R$ ${totalMesa.toFixed(2)}`);
                    await supabaseClient.from('pedidos').delete().eq('mesa', idMesaAberta);
                    setIdMesaAberta(null);
                    setBuscaProduto('');
                }
            };

            // ---- AÇÕES DE ESTOQUE ----
            const removerProduto = async (id, nome) => {
                if(confirm(`Excluir permanentemente o produto: ${nome}?`)) {
                    await supabaseClient.from('produtos').delete().eq('id', id);
                    registrarLog("EXCLUSÃO", `Produto removido: ${nome}`);
                }
            };

            // ---- AÇÕES DE EQUIPE ----
            const removerUsuario = async (id, nome) => {
                if(userLogado.usuario === nome) return alert("Você não pode excluir a si mesmo!");
                if(confirm(`Remover o acesso de ${nome}?`)) {
                    await supabaseClient.from('usuarios_gestao').delete().eq('id', id);
                    registrarLog("EQUIPE", `Removeu usuário: ${nome}`);
                }
            };

            if (!userLogado) return (
                <div className="h-screen flex items-center justify-center p-6 bg-slate-950">
                    <form onSubmit={async (e) => {
                        e.preventDefault();
                        const { data } = await supabaseClient.from('usuarios_gestao').select('*').eq('usuario', e.target.u.value.toLowerCase()).eq('senha', e.target.s.value).single();
                        if (data) { 
                            setUserLogado(data); 
                            safeSetItem('jb_user_data', JSON.stringify(data)); 
                            buscarDados(); 
                        }
                        else alert("Credenciais incorretas");
                    }} className="w-full max-w-sm bg-slate-900 p-8 rounded-[40px] border border-slate-800">
                        <h1 className="text-3xl font-black text-center mb-8 italic uppercase tracking-tighter">JB <span className="text-orange-500">Espeto</span></h1>
                        <input name="u" placeholder="USUÁRIO" className="w-full p-4 mb-4 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700 font-bold uppercase" required />
                        <input name="s" type="password" placeholder="SENHA" className="w-full p-4 mb-6 bg-slate-800 rounded-2xl text-white outline-none border border-slate-700 font-bold" required />
                        <button className="w-full bg-orange-600 p-4 rounded-2xl font-black uppercase shadow-lg shadow-orange-900/20">Entrar</button>
                    </form>
                </div>
            );

            return (
                <div className="min-h-screen pb-32">
                    <header className="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
                        <div className="font-black italic text-xl uppercase tracking-tighter">JB <span className="text-orange-500">Espeto</span></div>
                        <div className="flex items-center gap-3">
                            <span className="text-[9px] font-bold text-slate-500 uppercase">{userLogado.usuario}</span>
                            <button onClick={() => { safeRemoveItem('jb_user_data'); setUserLogado(null); }} className="text-[10px] font-black text-red-500 border border-red-500/20 px-2 py-1 rounded">SAIR</button>
                        </div>
                    </header>

                    <main className="p-4">
                        {pagina === 'home' && (
                            <div className="space-y-4">
                                {/* Painel de Adicionar/Remover Mesas */}
                                <div className="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                                    <div className="text-xs font-black uppercase text-slate-400">Total: {qtdMesas} Mesas</div>
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => {
                                                if (qtdMesas > 1) {
                                                    const ultimaMesaVal = mesas[qtdMesas - 1]?.total || 0;
                                                    if (ultimaMesaVal > 0) {
                                                        if (!confirm("A última mesa possui consumo ativo! Deseja realmente removê-la?")) return;
                                                    }
                                                    const novaQtd = qtdMesas - 1;
                                                    setQtdMesas(novaQtd);
                                                    safeSetItem('jb_qtd_mesas', novaQtd);
                                                }
                                            }}
                                            className="bg-red-600/10 border border-red-500/20 text-red-500 px-3 py-1.5 rounded-xl font-bold text-[10px] uppercase"
                                        >
                                            - Remover
                                        </button>
                                        <button 
                                            onClick={() => {
                                                const novaQtd = qtdMesas + 1;
                                                setQtdMesas(novaQtd);
                                                safeSetItem('jb_qtd_mesas', novaQtd);
                                            }}
                                            className="bg-green-600/10 border border-green-500/20 text-green-500 px-3 py-1.5 rounded-xl font-bold text-[10px] uppercase"
                                        >
                                            + Adicionar
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    {mesas.map(m => (
                                        <div key={m.id} onClick={() => setIdMesaAberta(m.id)} className={`p-4 rounded-2xl border-2 transition-all ${m.total > 0 ? 'bg-orange-600 border-orange-400 scale-105 shadow-xl' : 'bg-slate-800 border-slate-700 opacity-60'}`}>
                                            <div className="text-[10px] font-black uppercase opacity-80">Mesa {m.id}</div>
                                            <div className="text-xl font-black">R$ {m.total.toFixed(2)}</div>
                                            {m.apelido && <div className="text-[9px] bg-black/20 p-1 mt-1 rounded font-bold uppercase truncate">👤 {m.apelido}</div>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {pagina === 'estoque' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                {/* Formulário de Novo Produto Atualizado */}
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const nome = e.target.nome.value;
                                    const preco_compra = parseFloat(e.target.preco_compra.value) || 0;
                                    const preco = parseFloat(e.target.preco.value) || 0;
                                    const estoque = parseInt(e.target.estoque.value) || 0;
                                    const categoria = e.target.categoria.value;

                                    await supabaseClient.from('produtos').insert([{ 
                                        nome, 
                                        preco_compra, 
                                        preco, 
                                        estoque, 
                                        categoria 
                                    }]);
                                    
                                    registrarLog("ESTOQUE", `Novo item: ${nome} [${categoria}] - Compra: R$ ${preco_compra.toFixed(2)} / Venda: R$ ${preco.toFixed(2)}`);
                                    e.target.reset();
                                }} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3 shadow-inner">
                                    <h3 className="text-xs font-black uppercase text-orange-500 italic">Novo Produto</h3>
                                    <input name="nome" placeholder="NOME DO PRODUTO" className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold uppercase text-white" required />
                                    
                                    <div className="grid grid-cols-2 gap-2">
                                        <input name="preco_compra" type="number" step="0.01" placeholder="PREÇO COMPRA" className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold text-white" required />
                                        <input name="preco" type="number" step="0.01" placeholder="PREÇO VENDA" className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold text-white" required />
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-2">
                                        <input name="estoque" type="number" placeholder="ESTOQUE INICIAL" className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold text-white" required />
                                        <select name="categoria" className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold text-slate-300 uppercase">
                                            <option value="Cerveja">Cerveja</option>
                                            <option value="Bar">Bar</option>
                                            <option value="Dose">Dose</option>
                                            <option value="Espeto">Espeto</option>
                                            <option value="Cozinha">Cozinha</option>
                                            <option value="Outros">Outros</option>
                                        </select>
                                    </div>
                                    <button className="w-full bg-orange-600 p-3 rounded-xl font-black uppercase text-xs">Adicionar</button>
                                </form>

                                {/* Listagem do Estoque */}
                                <div className="space-y-2">
                                    {produtos.map(p => {
                                        const comp = Number(p.preco_compra || 0);
                                        const vend = Number(p.preco || 0);
                                        const lucro = vend - comp;
                                        
                                        return (
                                            <div key={p.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center gap-2">
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="font-black uppercase text-xs text-white truncate">{(p.nome || 'Produto sem nome')}</span>
                                                        <span className={`text-[8px] px-2 py-0.5 rounded-full font-black uppercase whitespace-nowrap ${obterCorCategoria(p.categoria)}`}>
                                                            {p.categoria || 'Outros'}
                                                        </span>
                                                    </div>
                                                    <div className="text-slate-500 text-[10px] font-bold space-y-0.5">
                                                        <div>Compra: R$ {comp.toFixed(2)} | Venda: R$ {vend.toFixed(2)}</div>
                                                        <div className="text-emerald-500">Lucro: R$ {lucro.toFixed(2)} | Est: {p.estoque || 0} unid.</div>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2 shrink-0">
                                                    <button onClick={() => setProdutoEditando(p)} className="bg-slate-800 p-2.5 rounded-xl text-blue-400">✏️</button>
                                                    <button onClick={() => removerProduto(p.id, p.nome)} className="bg-slate-800 p-2.5 rounded-xl text-red-500 font-bold">🗑️</button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {pagina === 'equipe' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const usuario = e.target.usuario.value.toLowerCase();
                                    const senha = e.target.senha.value;
                                    const nivel = e.target.nivel.value;
                                    await supabaseClient.from('usuarios_gestao').insert([{ usuario, senha, nivel }]);
                                    registrarLog("EQUIPE", `Novo membro: ${usuario}`);
                                    e.target.reset();
                                }} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3">
                                    <h3 className="text-xs font-black uppercase text-orange-500 italic">Adicionar Usuário</h3>
                                    <input name="usuario" placeholder="USUÁRIO" className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold uppercase" required />
                                    <input name="senha" type="password" placeholder="SENHA" className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold" required />
                                    <select name="nivel" className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold uppercase">
                                        <option value="atendente">Atendente</option>
                                        <option value="admin">Administrador</option>
                                    </select>
                                    <button className="w-full bg-orange-600 p-3 rounded-xl font-black uppercase text-xs">Criar Acesso</button>
                                </form>

                                <div className="space-y-2">
                                    {equipe.map(m => (
                                        <div key={m.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                            <div>
                                                <div className="font-black uppercase text-xs">{m.usuario}</div>
                                                <div className="text-orange-500 text-[9px] font-black uppercase italic">{m.nivel}</div>
                                            </div>
                                            <button onClick={() => removerUsuario(m.id, m.usuario)} className="bg-red-600/10 text-red-500 p-2 rounded-lg font-bold border border-red-500/20">🗑️</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {pagina === 'logs' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black text-orange-500 italic uppercase">Histórico do Sistema</h2>
                                
                                {/* Campo de Busca de Operador */}
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="🔍 BUSCAR POR OPERADOR..." 
                                        value={filtroUsuarioLog}
                                        onChange={(e) => {
                                            setFiltroUsuarioLog(e.target.value);
                                            setPaginaLog(1);
                                        }}
                                        className="w-full bg-slate-900 p-3.5 rounded-2xl outline-none text-xs font-bold uppercase border border-slate-800 text-white placeholder-slate-500 focus:border-orange-500 transition-colors"
                                    />
                                    {filtroUsuarioLog && (
                                        <button 
                                            onClick={() => { setFiltroUsuarioLog(''); setPaginaLog(1); }}
                                            className="bg-slate-800 border border-slate-700 px-4 rounded-2xl text-[10px] font-black uppercase text-slate-400 hover:text-white transition-colors"
                                        >
                                            Limpar
                                        </button>
                                    )}
                                </div>

                                {/* Listagem de Logs Formatados */}
                                <div className="space-y-3">
                                    {logsPaginados.map(l => (
                                        <div key={l.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 hover:border-slate-700 transition-colors flex flex-col gap-2">
                                            <div className="flex justify-between items-start gap-2">
                                                <span className={`text-[8px] px-2 py-0.5 rounded-full font-black uppercase tracking-wider ${obterBadgeAcao(l.acao)}`}>
                                                    {l.acao}
                                                </span>
                                                <span className="text-[9px] font-bold text-slate-500 whitespace-nowrap">
                                                    {new Date(l.data).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}
                                                </span>
                                            </div>
                                            <div className="text-white text-xs font-bold leading-relaxed break-words">
                                                {l.detalhes}
                                            </div>
                                            <div className="flex items-center gap-1.5 text-[9px] font-semibold text-slate-500 uppercase tracking-tight">
                                                <span>👤 Operador:</span>
                                                <span className="text-slate-300 font-bold">{l.usuario}</span>
                                            </div>
                                        </div>
                                    ))}

                                    {logsPaginados.length === 0 && (
                                        <div className="text-center text-slate-500 text-xs py-8 uppercase font-bold">Nenhum registro encontrado</div>
                                    )}
                                </div>

                                {/* Controles de Paginação */}
                                {totalPaginasLog > 1 && (
                                    <div className="flex justify-between items-center bg-slate-900 p-3 rounded-2xl border border-slate-800 mt-4 select-none">
                                        <button 
                                            disabled={paginaLogValida === 1}
                                            onClick={() => setPaginaLog(prev => Math.max(prev - 1, 1))}
                                            className="bg-slate-800 disabled:opacity-30 disabled:pointer-events-none px-4 py-2 rounded-xl text-xs font-bold uppercase border border-slate-700 text-white hover:bg-slate-700 transition-colors"
                                        >
                                            Anterior
                                        </button>
                                        
                                        <span className="text-xs font-black text-slate-400 uppercase tracking-tight">
                                            Página {paginaLogValida} de {totalPaginasLog}
                                        </span>

                                        <button 
                                            disabled={paginaLogValida === totalPaginasLog}
                                            onClick={() => setPaginaLog(prev => Math.min(prev + 1, totalPaginasLog))}
                                            className="bg-slate-800 disabled:opacity-30 disabled:pointer-events-none px-4 py-2 rounded-xl text-xs font-bold uppercase border border-slate-700 text-white hover:bg-slate-700 transition-colors"
                                        >
                                            Próxima
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {pagina === 'financeiro' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black text-orange-500 italic uppercase">Financeiro & Relatórios</h2>
                                
                                {/* Caixa de Hoje em Destaque */}
                                <div className="bg-slate-900 p-5 rounded-3xl border-2 border-emerald-500/30 space-y-4 shadow-xl">
                                    <div className="flex justify-between items-center">
                                        <div className="text-xs font-black uppercase text-emerald-400 tracking-wider">FATURAMENTO DE HOJE ({faturamentoHoje.data})</div>
                                        <span className="text-2xl font-black text-emerald-400">R$ {faturamentoHoje.totalDinheiro.toFixed(2)}</span>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2 pt-3 border-t border-slate-800 text-[9px] font-bold text-slate-500 uppercase">
                                        <div>
                                            <div>Vendas Dir.</div>
                                            <div className="text-white mt-1 text-xs">R$ {faturamentoHoje.vendas.toFixed(2)}</div>
                                        </div>
                                        <div>
                                            <div>Recebido Notas</div>
                                            <div className="text-white mt-1 text-xs">R$ {faturamentoHoje.recebidoNotas.toFixed(2)}</div>
                                        </div>
                                        <div>
                                            <div>Fiado Gerado</div>
                                            <div className="text-yellow-500 mt-1 text-xs font-black">R$ {faturamentoHoje.fiado.toFixed(2)}</div>
                                        </div>
                                    </div>
                                </div>

                                {/* Listagem do Histórico dos Outros Dias */}
                                <div className="space-y-2">
                                    <h3 className="text-xs font-black uppercase text-slate-400 italic tracking-wider mt-4">Histórico de Dias Anteriores</h3>
                                    {historicoFinanceiro
                                        .filter(d => d.data !== new Date().toLocaleDateString('pt-BR')) // Filtra fora o hoje para não duplicar
                                        .map(d => (
                                            <div key={d.data} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col gap-2 shadow-sm">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-xs font-black text-slate-400 uppercase tracking-wider">{d.data}</span>
                                                    <span className="text-sm font-black text-emerald-500">R$ {d.totalDinheiro.toFixed(2)}</span>
                                                </div>
                                                <div className="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800/60 text-[8px] font-bold text-slate-500 uppercase">
                                                    <div>
                                                        <div>Vendas Dir.</div>
                                                        <div className="text-slate-300 mt-0.5">R$ {d.vendas.toFixed(2)}</div>
                                                    </div>
                                                    <div>
                                                        <div>Recebido Notas</div>
                                                        <div className="text-slate-300 mt-0.5">R$ {d.recebidoNotas.toFixed(2)}</div>
                                                    </div>
                                                    <div>
                                                        <div>Fiado Gerado</div>
                                                        <div className="text-yellow-500/80 mt-0.5">R$ {d.fiado.toFixed(2)}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    }
                                    {historicoFinanceiro.length <= 1 && (
                                        <div className="text-center text-slate-500 text-xs py-8 uppercase font-bold">Nenhum histórico financeiro anterior encontrado</div>
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {pagina === 'notas' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black text-orange-500 italic uppercase">Notas Pendentes</h2>
                                
                                {/* Dashboard de Resumo de Notas */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800 flex flex-col justify-between">
                                        <div className="text-[9px] font-black uppercase text-slate-500 tracking-wider">TOTAL A RECEBER</div>
                                        <div className="text-2xl font-black text-green-500 mt-2">R$ {totalParaReceber.toFixed(2)}</div>
                                    </div>
                                    <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800 flex flex-col justify-between">
                                        <div className="text-[9px] font-black uppercase text-slate-500 tracking-wider">NOTAS EM ABERTO</div>
                                        <div className="text-xl font-black text-orange-500 mt-2">
                                            {totalNotasAbertas} <span className="text-[9px] font-bold text-slate-400 block mt-0.5">({totalClientesPendentes} Clientes)</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Listagem agrupada por Cliente */}
                                <div className="space-y-2">
                                    {notasAgrupadas.map(g => (
                                        <div key={g.cliente} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                            <div>
                                                <div className="font-black uppercase text-xs text-white">{g.cliente}</div>
                                                <div className="text-green-500 font-black mt-0.5 text-base">R$ {g.total.toFixed(2)}</div>
                                                <div className="text-[8px] text-slate-500 uppercase mt-1 font-bold">
                                                    {g.notasOriginais.length} {g.notasOriginais.length === 1 ? 'Nota em aberto' : 'Notas acumuladas'}
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => receberPagamentoCliente(g)}
                                                className="bg-green-600 p-3 rounded-xl text-[10px] font-black uppercase active:scale-95 transition-transform"
                                            >
                                                Receber
                                            </button>
                                        </div>
                                    ))}

                                    {notasAgrupadas.length === 0 && (
                                        <div className="text-center text-slate-500 text-xs py-8 uppercase font-bold">Nenhum cliente pendente</div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-md p-4 border-t border-slate-800 flex gap-2 z-40 overflow-x-auto no-scrollbar">
                        {abasDisponiveis.map(p => (
                            <button key={p} onClick={() => setPagina(p)} className={`flex-none px-6 py-4 rounded-2xl font-black text-[10px] uppercase transition-all ${pagina === p ? 'active-tab shadow-lg shadow-orange-600/30' : 'bg-slate-800 text-slate-500'}`}>
                                {p === 'home' ? 'Mesas' : p === 'financeiro' ? 'Financeiro' : p}
                            </button>
                        ))}
                    </nav>

                    {/* Modal Moderno para Edição de Produtos */}
                    {produtoEditando && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-sm z-[70] flex items-center justify-center p-6">
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const nome = e.target.editNome.value;
                                const preco_compra = parseFloat(e.target.editPrecoCompra.value) || 0;
                                const preco = parseFloat(e.target.editPreco.value) || 0;
                                const estoque = parseInt(e.target.editEstoque.value) || 0;
                                const categoria = e.target.editCategoria.value;
                                
                                await supabaseClient.from('produtos').update({ 
                                    nome, 
                                    preco_compra, 
                                    preco, 
                                    estoque, 
                                    categoria 
                                }).eq('id', produtoEditando.id);
                                
                                registrarLog("EDIÇÃO", `Alterou ${produtoEditando.nome} -> Compra: R$ ${preco_compra.toFixed(2)} / Venda: R$ ${preco.toFixed(2)} / Est: ${estoque} / Cat: ${categoria}`);
                                setProdutoEditando(null);
                                buscarDados();
                            }} className="bg-slate-900 w-full max-w-sm rounded-[30px] p-6 border border-slate-800 space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-black uppercase text-orange-500 italic">Editar Produto</h3>
                                    <button type="button" onClick={() => setProdutoEditando(null)} className="text-slate-500 hover:text-white font-bold text-xs uppercase">Cancelar</button>
                                </div>
                                
                                <div className="space-y-3">
                                    <div>
                                        <label className="text-[9px] font-bold text-slate-500 uppercase block mb-1">Nome</label>
                                        <input name="editNome" defaultValue={produtoEditando.nome} className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold uppercase text-white border border-slate-700/50" required />
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[9px] font-bold text-slate-500 uppercase block mb-1">Preço Compra</label>
                                            <input name="editPrecoCompra" type="number" step="0.01" defaultValue={produtoEditando.preco_compra || 0} className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold text-white border border-slate-700/50" required />
                                        </div>
                                        <div>
                                            <label className="text-[9px] font-bold text-slate-500 uppercase block mb-1">Preço Venda</label>
                                            <input name="editPreco" type="number" step="0.01" defaultValue={produtoEditando.preco || 0} className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold text-white border border-slate-700/50" required />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[9px] font-bold text-slate-500 uppercase block mb-1">Estoque</label>
                                            <input name="editEstoque" type="number" defaultValue={produtoEditando.estoque || 0} className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold text-white border border-slate-700/50" required />
                                        </div>
                                        <div>
                                            <label className="text-[9px] font-bold text-slate-500 uppercase block mb-1">Categoria</label>
                                            <select name="editCategoria" defaultValue={produtoEditando.categoria || 'Outros'} className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold text-slate-300 uppercase border border-slate-700/50">
                                                <option value="Cerveja">Cerveja</option>
                                                <option value="Bar">Bar</option>
                                                <option value="Dose">Dose</option>
                                                <option value="Espeto">Espeto</option>
                                                <option value="Cozinha">Cozinha</option>
                                                <option value="Outros">Outros</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <button className="w-full bg-orange-600 p-3.5 rounded-xl font-black uppercase text-xs text-white">Salvar Alterações</button>
                            </form>
                        </div>
                    )}

                    {idMesaAberta && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-sm z-[60] flex items-end">
                            <div className="bg-slate-900 w-full rounded-t-[40px] p-6 border-t border-slate-700 max-h-[90vh] flex flex-col">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-black text-orange-500 italic uppercase">Atendimento Mesa {idMesaAberta}</h2>
                                    <button onClick={() => { setIdMesaAberta(null); setBuscaProduto(''); }} className="bg-slate-800 w-10 h-10 rounded-full font-bold">✕</button>
                                </div>
                                
                                <div className="bg-slate-950 p-4 rounded-3xl mb-4 border border-slate-800 shadow-inner">
                                    <div className="max-h-24 overflow-y-auto mb-2 space-y-1">
                                        {(mesas[idMesaAberta-1]?.itens || []).map((it, i) => (
                                            <div key={i} className="flex justify-between text-[10px] font-bold uppercase text-slate-400">
                                                <span>{it.produto_nome}</span>
                                                <div className="flex gap-4">
                                                    <span>R$ {Number(it.preco_unidade || 0).toFixed(2)}</span>
                                                    <button onClick={async () => { await supabaseClient.from('pedidos').delete().eq('id', it.id); buscarDados(); }} className="text-red-500 font-bold">X</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="text-right text-2xl font-black pt-2 border-t border-slate-800 text-white">R$ {(mesas[idMesaAberta-1]?.total || 0).toFixed(2)}</div>
                                </div>

                                {/* Campo de Busca de Produtos */}
                                <div className="mb-4">
                                    <input 
                                        type="text" 
                                        placeholder="🔍 BUSCAR PRODUTO..." 
                                        value={buscaProduto}
                                        onChange={(e) => setBuscaProduto(e.target.value)}
                                        className="w-full bg-slate-800 p-3.5 rounded-2xl outline-none text-xs font-bold uppercase border border-slate-700 text-white placeholder-slate-500 focus:border-orange-500 transition-colors"
                                    />
                                </div>

                                {/* Listagem de Produtos Filtrada com Quantidade de Estoque */}
                                <div className="flex-1 overflow-y-auto grid grid-cols-2 gap-2 mb-4">
                                    {produtos
                                        .filter(p => {
                                            const nomeLimpo = (p.nome || '').toLowerCase();
                                            const buscaLimpa = (buscaProduto || '').toLowerCase();
                                            return nomeLimpo.includes(buscaLimpa);
                                        })
                                        .map(p => (
                                            <button 
                                                key={p.id} 
                                                onClick={() => adicionarProdutoMesa(p)} 
                                                className="p-3 bg-slate-800 rounded-xl text-left border border-slate-700 active:scale-95 transition-transform"
                                            >
                                                <div className="text-[10px] font-black text-slate-400 uppercase truncate">{(p.nome || 'Sem nome')}</div>
                                                <div className="font-black text-white text-xs mt-0.5">R$ {Number(p.preco || 0).toFixed(2)}</div>
                                                <div className="text-[8px] font-bold text-slate-500 mt-2 uppercase">
                                                    Estoque: <span className={(p.estoque || 0) > 5 ? 'text-green-500' : 'text-red-500 font-black'}>{p.estoque || 0}</span>
                                                </div>
                                            </button>
                                        ))
                                    }
                                    {produtos.filter(p => (p.nome || '').toLowerCase().includes(buscaProduto.toLowerCase())).length === 0 && (
                                        <div className="col-span-2 text-center text-slate-500 text-xs py-4 uppercase font-bold">Nenhum produto encontrado</div>
                                    )}
                                </div>
                                
                                <div className="grid grid-cols-3 gap-2">
                                    <button onClick={alterarApelido} className="bg-slate-700 p-4 rounded-2xl font-black uppercase text-[10px]">Apelido</button>
                                    <button onClick={registrarFiado} className="bg-orange-600 p-4 rounded-2xl font-black uppercase text-[10px]">Fiado</button>
                                    <button onClick={registrarPagamento} className="bg-red-600 p-4 rounded-2xl font-black uppercase text-[10px]">Pagar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render((<App />));
    </script>
</body>
</html>
