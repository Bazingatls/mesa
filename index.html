<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tô Atoa Conveniência - GESTÃO TOTAL</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { background-color: #ea580c !important; color: white !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* CONFIGURAÇÃO DE IMPRESSÃO TÉRMICA */
        @media screen { .print-only { display: none !important; } }
        @media print {
            body * { visibility: hidden; }
            #secao-impressao, #secao-impressao * { visibility: visible; }
            #secao-impressao {
                position: absolute; left: 0; top: 0; width: 100%;
                background: white !important; color: black !important;
                font-family: 'Courier New', monospace; font-size: 12px;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        const SUPABASE_URL = 'https://zpzjpkrglknnhoojglmv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwempwa3JnbGtubmhvb2pnbG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzY4NTUsImV4cCI6MjA5MzA1Mjg1NX0.6BV3CTuBjOXraXnswNBpZoapHF_NDV7P4O1ja_cVNEY'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const safeGetItem = (key, fallback) => {
            try { const val = localStorage.getItem(key); return val !== null ? val : fallback; } catch (e) { return fallback; }
        };
        const safeSetItem = (key, value) => {
            try { localStorage.setItem(key, value); } catch (e) { console.warn("Erro LocalStorage", e); }
        };
        const safeRemoveItem = (key) => { try { localStorage.removeItem(key); } catch (e) {} };

        const obterBadgeAcao = (acao) => {
            const a = (acao || '').toUpperCase();
            if (a.includes('EXCLUSÃO') || a.includes('FECHAMENTO')) return 'bg-red-500/20 text-red-400 border border-red-500/30';
            if (a.includes('ABERTURA') || a.includes('LOGIN')) return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
            if (a.includes('EDIÇÃO')) return 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
            if (a.includes('FIADO')) return 'bg-yellow-500/20 text-yellow-500 border border-yellow-500/30';
            if (a.includes('PAGO') || a.includes('VENDA')) return 'bg-green-500/20 text-green-400 border border-green-500/30';
            return 'bg-slate-700/50 text-slate-300 border border-slate-600/30';
        };

        const App = () => {
            const [userLogado, setUserLogado] = useState(null);
            const [pagina, setPagina] = useState('home');
            const [qtdMesas, setQtdMesas] = useState(() => Number(safeGetItem('jb_qtd_mesas', '12')));
            const [mesas, setMesas] = useState([]);
            const [produtos, setProdutos] = useState([]);
            const [categoriasDb, setCategoriasDb] = useState(null);
            const [notas, setNotas] = useState([]);
            const [logs, setLogs] = useState([]);
            const [equipe, setEquipe] = useState([]);
            const [listaGastos, setListaGastos] = useState([]);
            const [idMesaAberta, setIdMesaAberta] = useState(null);
            const [buscaProduto, setBuscaProduto] = useState('');
            const [categoriaSelecionada, setCategoriaSelecionada] = useState('Todos');
            const [produtoEditando, setProdutoEditando] = useState(null);
            const [filtroUsuarioLog, setFiltroUsuarioLog] = useState('');

            const userRef = useRef(null);
            useEffect(() => { userRef.current = userLogado; }, [userLogado]);

            const categoriasAtendimento = useMemo(() => {
                const lista = [{ id: 'Todos', label: 'Todos', emoji: '🍽️', nome: 'Todos' }];
                if (categoriasDb) categoriasDb.forEach(c => lista.push({ id: c.nome, label: c.nome, nome: c.nome, emoji: c.emoji || '📦' }));
                return lista;
            }, [categoriasDb]);

            const buscarDados = useCallback(async () => {
                try {
                    const { data: eq } = await supabaseClient.from('usuarios_gestao').select('*').order('usuario');
                    if (eq) {
                        setEquipe(eq);
                        if (userRef.current) {
                            const aindaExiste = eq.some(u => u.usuario === userRef.current.usuario);
                            if (!aindaExiste) {
                                safeRemoveItem('jb_user_data');
                                setUserLogado(null);
                                alert("Acesso removido. Você será deslogado por segurança.");
                                return;
                            }
                        }
                    }

                    const { data: prods } = await supabaseClient.from('produtos').select('*').order('nome');
                    if (prods) setProdutos(prods);
                    const { data: cats } = await supabaseClient.from('categorias').select('*').order('nome');
                    if (cats) setCategoriasDb(cats);
                    const { data: config } = await supabaseClient.from('configuracoes_sistema').select('*').eq('chave', 'qtd_mesas').single();
                    if (config) setQtdMesas(Number(config.valor));
                    
                    const { data: pedidos } = await supabaseClient.from('pedidos').select('*');
                    const novasMesas = Array.from({ length: qtdMesas }, (_, i) => ({ id: i + 1, itens: [], total: 0, apelido: '' }));
                    if (pedidos) {
                        pedidos.forEach(p => {
                            const idx = p.mesa - 1;
                            if (novasMesas[idx]) {
                                novasMesas[idx].itens.push(p);
                                novasMesas[idx].total += Number(p.preco_unidade);
                                if (p.apelido_mesa) novasMesas[idx].apelido = p.apelido_mesa;
                            }
                        });
                    }
                    setMesas(novasMesas);
                    const { data: nts } = await supabaseClient.from('notas_pendentes').select('*').eq('pago', false).order('data', { ascending: false });
                    if (nts) setNotas(nts);
                    const { data: lg } = await supabaseClient.from('logs_sistema').select('*').order('data', { ascending: false }).limit(100);
                    if (lg) setLogs(lg);
                    const { data: gst } = await supabaseClient.from('gastos').select('*').order('data', { ascending: false });
                    if (gst) setListaGastos(gst);
                } catch (e) { console.error(e); }
            }, [qtdMesas]);

            useEffect(() => {
                const sessao = safeGetItem('jb_user_data', null);
                if (sessao) setUserLogado(JSON.parse(sessao));
                buscarDados();
                const t = setInterval(buscarDados, 5000);
                return () => clearInterval(t);
            }, [buscarDados]);

            const registrarLog = async (acao, detalhes) => {
                if(!userLogado) return;
                await supabaseClient.from('logs_sistema').insert([{ usuario: userLogado.usuario, acao, detalhes }]);
                buscarDados();
            };

            const salvarNovaQtdMesas = async (novaQtd) => {
                if (novaQtd < 1) return;
                setQtdMesas(novaQtd);
                safeSetItem('jb_qtd_mesas', novaQtd);
                await supabaseClient.from('configuracoes_sistema').update({ valor: String(novaQtd) }).eq('chave', 'qtd_mesas');
                registrarLog("SISTEMA", `Alterou qtd de mesas para ${novaQtd}`);
            };

            const resumoFinanceiroTotal = useMemo(() => {
                const dias = {};
                logs.forEach(l => {
                    if (!l.data) return;
                    const dF = new Date(l.data).toLocaleDateString('pt-BR');
                    if (!dias[dF]) dias[dF] = { data: dF, dataObj: new Date(l.data), vendas: 0, recebidoFiado: 0, saidas: 0, fiadoGerado: 0 };
                    const acao = (l.acao || '').toUpperCase();
                    const match = (l.detalhes || '').match(/R\$\s*([0-9.,]+)/i);
                    const valor = match ? parseFloat(match[1].replace(',', '.')) : 0;
                    if (acao === 'VENDA' || acao === 'FECHAMENTO') dias[dF].vendas += valor;
                    else if (acao.includes('PAGO FIADO')) dias[dF].recebidoFiado += valor;
                    else if (acao === 'FIADO') dias[dF].fiadoGerado += valor;
                });
                listaGastos.forEach(g => {
                    if (!g.data) return;
                    const dF = new Date(g.data).toLocaleDateString('pt-BR');
                    if (!dias[dF]) dias[dF] = { data: dF, dataObj: new Date(g.data), vendas: 0, recebidoFiado: 0, saidas: 0, fiadoGerado: 0 };
                    dias[dF].saidas += Number(g.valor || 0);
                });
                return Object.values(dias).map(d => ({ ...d, totalEntradas: d.vendas + d.recebidoFiado, saldoFinal: (d.vendas + d.recebidoFiado) - d.saidas })).sort((a, b) => b.dataObj - a.dataObj);
            }, [logs, listaGastos]);

            const finHoje = useMemo(() => {
                const hoje = new Date().toLocaleDateString('pt-BR');
                return resumoFinanceiroTotal.find(d => d.data === hoje) || { data: hoje, vendas: 0, recebidoFiado: 0, saidas: 0, totalEntradas: 0, saldoFinal: 0, fiadoGerado: 0 };
            }, [resumoFinanceiroTotal]);

            const adicionarProdutoMesa = async (p) => {
                if (p.estoque <= 0) return alert("Sem estoque!");
                const mesaAtual = mesas[idMesaAberta - 1];
                if (mesaAtual.itens.length === 0) {
                    await registrarLog("ABERTURA", `Abriu a Mesa ${idMesaAberta}`);
                }
                await supabaseClient.from('pedidos').insert([{ mesa: idMesaAberta, produto_nome: p.nome, preco_unidade: p.preco, apelido_mesa: mesaAtual?.apelido || '' }]);
                await supabaseClient.from('produtos').update({ estoque: p.estoque - 1 }).eq('id', p.id);
                buscarDados();
            };

            const registrarPagamento = async () => {
                if (confirm("Confirmar pagamento?")) {
                    const total = mesas[idMesaAberta-1]?.total || 0;
                    await registrarLog("FECHAMENTO", `Mesa ${idMesaAberta} PAGA: R$ ${total.toFixed(2)}`);
                    await supabaseClient.from('pedidos').delete().eq('mesa', idMesaAberta);
                    setIdMesaAberta(null);
                }
            };

            const receberPagamentoFiado = async (grupo) => {
                const inputVal = prompt(`Cliente: ${grupo.cliente}\nTotal: R$ ${grupo.total.toFixed(2)}\nValor Pago:`, grupo.total.toFixed(2));
                if (!inputVal) return;
                const valorPago = parseFloat(inputVal);
                let restante = valorPago;
                const notasOrdenadas = [...grupo.notasOriginais].sort((a,b) => a.id - b.id);
                for (let n of notasOrdenadas) {
                    if (restante <= 0) break;
                    const vNota = Number(n.valor);
                    if (restante >= vNota) { await supabaseClient.from('notas_pendentes').update({ pago: true }).eq('id', n.id); restante -= vNota; }
                    else { await supabaseClient.from('notas_pendentes').update({ valor: vNota - restante }).eq('id', n.id); restante = 0; }
                }
                registrarLog("PAGO FIADO", `${grupo.cliente}: Recebeu R$ ${valorPago.toFixed(2)}`);
            };

            const notasAgrupadas = useMemo(() => {
                const grupos = {};
                notas.forEach(n => {
                    const c = n.cliente.toUpperCase().trim();
                    if (!grupos[c]) grupos[c] = { cliente: c, total: 0, notasOriginais: [] };
                    grupos[c].total += Number(n.valor);
                    grupos[c].notasOriginais.push(n);
                });
                return Object.values(grupos).sort((a,b) => b.total - a.total);
            }, [notas]);

            const abasDisponiveis = useMemo(() => {
                if (userLogado?.nivel === 'admin') return ['home', 'notas', 'estoque', 'equipe', 'logs', 'financeiro', 'gastos'];
                return ['home'];
            }, [userLogado]);

            if (!userLogado) return (
                <div className="h-screen flex items-center justify-center p-6 bg-slate-950">
                    <form onSubmit={async (e) => {
                        e.preventDefault();
                        const { data } = await supabaseClient.from('usuarios_gestao').select('*').eq('usuario', e.target.u.value.toLowerCase()).eq('senha', e.target.s.value).single();
                        if (data) { 
                            setUserLogado(data); 
                            safeSetItem('jb_user_data', JSON.stringify(data)); 
                            // REGISTRO DE LOG DE LOGIN
                            await supabaseClient.from('logs_sistema').insert([{ usuario: data.usuario, acao: "LOGIN", detalhes: "Usuário entrou no sistema" }]);
                            buscarDados(); 
                        }
                        else alert("Credenciais incorretas");
                    }} className="w-full max-w-sm bg-slate-900 p-8 rounded-[40px] border border-slate-800 shadow-2xl">
                        <h1 className="text-3xl font-black text-center mb-8 italic uppercase tracking-tighter">Tô Atoa <span className="text-orange-500">Conveniência</span></h1>
                        <input name="u" placeholder="USUÁRIO" className="w-full p-4 mb-4 bg-slate-800 rounded-2xl font-bold uppercase text-white border border-slate-700 outline-none" required />
                        <input name="s" type="password" placeholder="SENHA" className="w-full p-4 mb-6 bg-slate-800 rounded-2xl font-bold text-white border border-slate-700 outline-none" required />
                        <button className="w-full bg-orange-600 p-4 rounded-2xl font-black uppercase shadow-lg shadow-orange-900/20">Entrar</button>
                    </form>
                </div>
            );

            return (
                <div className="min-h-screen pb-32">
                    <header className="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50 no-print">
                        <div className="font-black italic text-xl uppercase tracking-tighter">Tô Atoa <span className="text-orange-500">Conveniência</span></div>
                        <button onClick={() => { safeRemoveItem('jb_user_data'); setUserLogado(null); }} className="text-[10px] font-black text-red-500 border border-red-500/20 px-2 py-1 rounded uppercase">Sair</button>
                    </header>

                    <main className="p-4 no-print space-y-6">
                        {pagina === 'home' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                                    <div className="text-xs font-black uppercase text-slate-400">Total: {qtdMesas} Mesas</div>
                                    <div className="flex gap-2">
                                        <button onClick={() => salvarNovaQtdMesas(qtdMesas - 1)} className="bg-slate-800 px-3 py-1 rounded-xl border border-slate-700">-</button>
                                        <button onClick={() => salvarNovaQtdMesas(qtdMesas + 1)} className="bg-slate-800 px-3 py-1 rounded-xl border border-slate-700">+</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    {mesas.map(m => (
                                        <div key={m.id} onClick={() => setIdMesaAberta(m.id)} className={`p-4 rounded-2xl border-2 transition-all ${m.total > 0 ? 'bg-orange-600 border-orange-400 scale-105 shadow-xl' : 'bg-slate-800 border-slate-700 opacity-60'}`}>
                                            <div className="text-[10px] font-black uppercase opacity-80">Mesa {m.id}</div>
                                            <div className="text-xl font-black">R$ {m.total.toFixed(2)}</div>
                                            {m.apelido && <div className="text-[9px] bg-black/20 p-1 mt-1 rounded font-bold uppercase truncate">👤 {m.apelido}</div>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ABA ESTOQUE COM SEÇÃO DE ETIQUETAS RESTAURADA */}
                        {pagina === 'estoque' && userLogado.nivel === 'admin' && (
                            <div className="space-y-6">
                                {/* SEÇÃO: GERENCIAR ETIQUETAS */}
                                <div className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-4">
                                    <h3 className="text-xs font-black uppercase text-orange-500 italic">Etiquetas (Categorias)</h3>
                                    <form onSubmit={async (e) => {
                                        e.preventDefault();
                                        const nome = e.target.catNome.value.trim();
                                        const emoji = e.target.catEmoji.value.trim() || '📦';
                                        if (nome) { 
                                            await supabaseClient.from('categorias').insert([{ nome, emoji }]); 
                                            registrarLog("ESTOQUE", `Nova categoria: ${nome}`); 
                                            e.target.reset(); 
                                            buscarDados(); 
                                        }
                                    }} className="space-y-3">
                                        <div className="grid grid-cols-4 gap-2">
                                            <input name="catEmoji" placeholder="EMOJI" maxLength="2" className="bg-slate-800 p-3 rounded-xl outline-none text-sm text-center font-bold text-white border border-slate-700/50" />
                                            <input name="catNome" placeholder="NOME" className="col-span-3 bg-slate-800 p-3 rounded-xl outline-none text-sm font-bold uppercase text-white border border-slate-700/50" required />
                                        </div>
                                        <button className="w-full bg-orange-600 p-3 rounded-xl font-black uppercase text-xs">Criar Categoria</button>
                                    </form>
                                    <div className="flex flex-wrap gap-2">
                                        {categoriasDb?.map(c => (
                                            <div key={c.id} className="bg-slate-800 px-3 py-1.5 rounded-xl text-xs font-black flex items-center gap-2 border border-slate-700">
                                                <span>{c.emoji} {c.nome}</span>
                                                <button onClick={async () => { if(confirm(`Excluir ${c.nome}?`)) { await supabaseClient.from('categorias').delete().eq('id', c.id); buscarDados(); } }} className="text-red-500 font-bold">✕</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* SEÇÃO: NOVO PRODUTO */}
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const nome = e.target.n.value.toUpperCase();
                                    await supabaseClient.from('produtos').insert([{ nome, preco_compra: e.target.pc.value, preco: e.target.pv.value, estoque: e.target.es.value, categoria: e.target.ct.value }]);
                                    registrarLog("ESTOQUE", `Cadastrou produto: ${nome}`);
                                    e.target.reset(); buscarDados();
                                }} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3">
                                    <h3 className="text-xs font-black uppercase text-blue-500 italic">Novo Produto</h3>
                                    <input name="n" placeholder="NOME DO PRODUTO" className="w-full bg-slate-800 p-3 rounded-xl font-bold uppercase outline-none border border-slate-700" required />
                                    <div className="grid grid-cols-2 gap-2">
                                        <input name="pc" type="number" step="0.01" placeholder="PREÇO COMPRA" className="bg-slate-800 p-3 rounded-xl font-bold border border-slate-700" required />
                                        <input name="pv" type="number" step="0.01" placeholder="PREÇO VENDA" className="bg-slate-800 p-3 rounded-xl font-bold border border-slate-700" required />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <input name="es" type="number" placeholder="ESTOQUE" className="bg-slate-800 p-3 rounded-xl font-bold border border-slate-700" required />
                                        <select name="ct" className="bg-slate-800 p-3 rounded-xl font-bold uppercase border border-slate-700">
                                            {categoriasAtendimento.filter(c => c.id !== 'Todos').map(c => <option key={c.id} value={c.nome}>{c.nome}</option>)}
                                        </select>
                                    </div>
                                    <button className="w-full bg-blue-600 p-3 rounded-xl font-black uppercase text-xs">Adicionar Produto</button>
                                </form>

                                {/* LISTA PRODUTOS */}
                                <div className="space-y-2">
                                    {produtos.map(p => (
                                        <div key={p.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                            <div className="flex-1 min-w-0">
                                                <div className="font-black uppercase text-xs truncate">{p.nome} <span className="text-[8px] text-blue-400 ml-2">[{p.categoria}]</span></div>
                                                <div className="text-[10px] font-bold text-slate-500">R$ {Number(p.preco).toFixed(2)} | Est: {p.estoque} un</div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => setProdutoEditando(p)} className="bg-slate-800 p-2 rounded-xl text-blue-400">✏️</button>
                                                <button onClick={async () => { if(confirm('Excluir?')){ await supabaseClient.from('produtos').delete().eq('id', p.id); registrarLog("ESTOQUE", `Excluiu produto: ${p.nome}`); buscarDados(); } }} className="bg-slate-800 p-2 rounded-xl text-red-500">🗑️</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* FINANCEIRO */}
                        {pagina === 'financeiro' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black text-orange-500 italic uppercase">Financeiro</h2>
                                <div className="bg-slate-900 p-6 rounded-[32px] border-2 border-slate-800 shadow-xl space-y-4">
                                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                        <span className="text-[10px] font-black text-slate-500 uppercase">Caixa Hoje ({finHoje.data})</span>
                                        <span className={`text-xl font-black ${finHoje.saldoFinal >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>R$ {finHoje.saldoFinal.toFixed(2)}</span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 text-xs font-black uppercase">
                                        <div><div className="text-slate-500 text-[9px]">Entradas</div><div className="text-emerald-400">R$ {finHoje.totalEntradas.toFixed(2)}</div></div>
                                        <div className="text-right"><div className="text-slate-500 text-[9px]">Saídas</div><div className="text-red-500">R$ {finHoje.saidas.toFixed(2)}</div></div>
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    {resumoFinanceiroTotal.map((d, i) => (
                                        <div key={i} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                            <span className="font-black text-xs uppercase">{d.data}</span>
                                            <span className={`font-black text-sm ${d.saldoFinal >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>R$ {d.saldoFinal.toFixed(2)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* GASTOS */}
                        {pagina === 'gastos' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black text-red-500 italic uppercase">Gastos / Insumos</h2>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const d = e.target.descricao.value.trim();
                                    const v = parseFloat(e.target.valor.value);
                                    await supabaseClient.from('gastos').insert([{ descricao: d.toUpperCase(), valor: v, data: new Date().toISOString() }]);
                                    registrarLog("GASTO", `${d.toUpperCase()}: R$ ${v.toFixed(2)}`);
                                    e.target.reset(); buscarDados();
                                }} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-4">
                                    <input name="descricao" placeholder="O que comprou?" className="w-full bg-slate-800 p-4 rounded-2xl font-bold uppercase outline-none text-white border border-slate-700" required />
                                    <input name="valor" type="number" step="0.01" placeholder="Valor R$" className="w-full bg-slate-800 p-4 rounded-2xl font-bold outline-none text-white border border-slate-700" required />
                                    <button className="w-full bg-red-600 p-4 rounded-2xl font-black uppercase">Lançar Saída</button>
                                </form>
                                <div className="space-y-2">
                                    {listaGastos.map(g => (
                                        <div key={g.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                            <div><div className="font-black uppercase text-xs">{g.descricao}</div><div className="text-[9px] text-slate-500 font-mono">{new Date(g.data).toLocaleDateString('pt-BR')}</div></div>
                                            <div className="flex gap-4 items-center font-black text-red-400">R$ {Number(g.valor).toFixed(2)} <button onClick={async () => { if(confirm('Remover?')){ await supabaseClient.from('gastos').delete().eq('id', g.id); buscarDados(); } }} className="text-red-500">✕</button></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* FIADOS */}
                        {pagina === 'notas' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black text-yellow-500 italic uppercase">Notas Pendentes</h2>
                                <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800 flex justify-between items-center">
                                    <span className="text-[10px] font-black uppercase text-slate-500">Total Fiado</span>
                                    <span className="text-2xl font-black text-yellow-500">R$ {notas.reduce((a, b) => a + Number(b.valor), 0).toFixed(2)}</span>
                                </div>
                                <div className="space-y-2">
                                    {notasAgrupadas.map((g, i) => (
                                        <div key={i} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                            <div><div className="font-black uppercase text-xs">{g.cliente}</div><div className="text-emerald-500 font-black">R$ {g.total.toFixed(2)}</div></div>
                                            <button onClick={() => receberPagamentoFiado(g)} className="bg-green-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase">Receber</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* EQUIPE */}
                        {pagina === 'equipe' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black text-purple-500 italic uppercase">Equipe</h2>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const user = e.target.u.value.toLowerCase();
                                    await supabaseClient.from('usuarios_gestao').insert([{ usuario: user, senha: e.target.s.value, nivel: e.target.n.value }]);
                                    registrarLog("SISTEMA", `Criou acesso para: ${user}`);
                                    e.target.reset(); buscarDados();
                                }} className="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-4">
                                    <input name="u" placeholder="USUÁRIO" className="w-full bg-slate-800 p-3 rounded-xl font-bold uppercase outline-none border border-slate-700" required />
                                    <input name="s" type="password" placeholder="SENHA" className="w-full bg-slate-800 p-3 rounded-xl font-bold border border-slate-700" required />
                                    <select name="n" className="w-full bg-slate-800 p-3 rounded-xl font-bold border border-slate-700 uppercase">
                                        <option value="atendente">Atendente</option>
                                        <option value="admin">Gerente (Admin)</option>
                                    </select>
                                    <button className="w-full bg-purple-600 p-3 rounded-xl font-black uppercase text-xs">Criar Acesso</button>
                                </form>
                                <div className="space-y-2">
                                    {equipe.map(u => (
                                        <div key={u.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                            <div><div className="font-black uppercase text-xs">{u.usuario}</div><div className="text-[9px] text-slate-500 uppercase">{u.nivel}</div></div>
                                            <button onClick={async () => { if(confirm('Remover?')){ await supabaseClient.from('usuarios_gestao').delete().eq('id', u.id); buscarDados(); } }} className="text-red-500">🗑️</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* LOGS */}
                        {pagina === 'logs' && userLogado.nivel === 'admin' && (
                            <div className="space-y-4">
                                <h2 className="text-xl font-black text-slate-500 italic uppercase">Histórico / Logs</h2>
                                <input placeholder="Filtrar por operador..." onChange={e => setFiltroUsuarioLog(e.target.value)} className="w-full bg-slate-900 p-4 rounded-2xl text-xs font-bold uppercase border border-slate-800" />
                                <div className="space-y-3">
                                    {logs.filter(l => l.usuario.toLowerCase().includes(filtroUsuarioLog.toLowerCase())).map(l => (
                                        <div key={l.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col gap-1">
                                            <div className="flex justify-between"><span className={`text-[8px] px-2 py-0.5 rounded-full font-black uppercase ${obterBadgeAcao(l.acao)}`}>{l.acao}</span><span className="text-[9px] text-slate-500">{new Date(l.data).toLocaleString('pt-BR')}</span></div>
                                            <div className="text-xs font-bold text-white">{l.detalhes}</div>
                                            <div className="text-[8px] text-slate-500 uppercase font-black">👤 Operador: {l.usuario}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MENU INFERIOR FIXO */}
                    <nav className="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-md p-3 border-t border-slate-800 flex gap-2 z-40 overflow-x-auto no-scrollbar no-print">
                        {abasDisponiveis.map(p => (
                            <button key={p} onClick={() => setPagina(p)} className={`flex-none px-5 py-3 rounded-2xl font-black text-[10px] uppercase transition-all ${pagina === p ? 'active-tab shadow-lg shadow-orange-600/30' : 'bg-slate-800 text-slate-500'}`}>
                                {p === 'home' ? '🏠 Mesas' : p === 'financeiro' ? '💰 Financeiro' : p === 'gastos' ? '📉 Gastos' : p === 'notas' ? '📝 Fiados' : p === 'estoque' ? '📦 Estoque' : p === 'equipe' ? '👥 Equipe' : '📋 Logs'}
                            </button>
                        ))}
                    </nav>

                    {/* MODAL MESA ABERTA */}
                    {idMesaAberta && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-sm z-[60] flex items-end no-print">
                            <div className="bg-slate-900 w-full rounded-t-[40px] p-5 border-t border-slate-700 h-[95vh] flex flex-col">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-black text-orange-500 italic uppercase">Mesa {idMesaAberta}</h2>
                                    <button onClick={() => { setIdMesaAberta(null); setBuscaProduto(''); setCategoriaSelecionada('Todos'); }} className="bg-slate-800 w-10 h-10 rounded-full font-bold flex items-center justify-center text-white">✕</button>
                                </div>

                                <div className="bg-slate-950 p-3 rounded-2xl mb-4 border border-slate-800 shadow-inner">
                                    <div className="max-h-24 overflow-y-auto mb-2 space-y-1 pr-1 custom-scrollbar">
                                        {(mesas[idMesaAberta-1]?.itens || []).map((it, i) => (
                                            <div key={i} className="flex justify-between text-[13px] font-bold uppercase text-slate-400">
                                                <span className="truncate">{it.produto_nome}</span>
                                                <div className="flex gap-3 items-center">
                                                    <span>R$ {Number(it.preco_unidade).toFixed(2)}</span>
                                                    <button onClick={async () => { 
                                                        await supabaseClient.from('pedidos').delete().eq('id', it.id); 
                                                        const p = produtos.find(x => x.nome === it.produto_nome);
                                                        if (p) await supabaseClient.from('produtos').update({ estoque: p.estoque + 1 }).eq('id', p.id);
                                                        buscarDados(); 
                                                    }} className="text-red-500 font-black">✕</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="text-right text-lg font-black pt-1 border-t border-slate-800 text-white italic uppercase">R$ {(mesas[idMesaAberta-1]?.total || 0).toFixed(2)}</div>
                                </div>
                                
                                <input type="text" placeholder="🔍 BUSCAR PRODUTO..." value={buscaProduto} onChange={(e) => setBuscaProduto(e.target.value)} className="w-full bg-slate-800 p-3.5 rounded-xl outline-none text-sm font-bold uppercase border border-slate-700 text-white mb-3 shadow-inner" />
                                
                                <div className="flex gap-2 overflow-x-auto no-scrollbar mb-4 pb-2">
                                    {categoriasAtendimento.map(cat => (
                                        <button key={cat.id} onClick={() => setCategoriaSelecionada(cat.id)} className={`flex-none flex items-center gap-2 px-5 py-2.5 rounded-xl text-[10px] font-black border-2 transition-all uppercase ${categoriaSelecionada === cat.id ? 'bg-orange-600 border-orange-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>
                                            <span>{cat.emoji}</span><span>{cat.label}</span>
                                        </button>
                                    ))}
                                </div>
                                
                                <div className="flex-1 overflow-y-auto grid grid-cols-2 gap-3 mb-4 pr-1 custom-scrollbar">
                                    {produtos.filter(p => (categoriaSelecionada === 'Todos' || p.categoria === categoriaSelecionada) && p.nome.toLowerCase().includes(buscaProduto.toLowerCase())).map(p => (
                                        <button key={p.id} onClick={() => adicionarProdutoMesa(p)} className="p-4 bg-slate-800 rounded-2xl text-left border border-slate-700 active:scale-95 flex flex-col justify-between min-h-[85px] shadow-lg">
                                            <div className="text-[11px] font-black text-white uppercase leading-tight">{p.nome}</div>
                                            <div className="flex justify-between items-end mt-2"><div className="font-black text-orange-500 text-sm">R$ {Number(p.preco).toFixed(2)}</div><div className="text-[11px] font-bold text-slate-500">Est: {p.estoque}</div></div>
                                        </button>
                                    ))}
                                </div>
                                
                                <div className="grid grid-cols-4 gap-2 pt-2">
                                    <button onClick={() => { const ap = prompt("Nome:", mesas[idMesaAberta-1]?.apelido); if(ap !== null) supabaseClient.from('pedidos').update({ apelido_mesa: ap }).eq('mesa', idMesaAberta).then(buscarDados); }} className="bg-slate-700 p-4 rounded-2xl font-black text-lg text-white">👤</button>
                                    <button onClick={() => window.print()} className="bg-blue-600 p-4 rounded-2xl font-black text-lg text-white">🖨️</button>
                                    <button onClick={() => { const cl = prompt("Nome do Fiado:"); if(cl) { const t = mesas[idMesaAberta-1].total; supabaseClient.from('notas_pendentes').insert([{ cliente: cl.toUpperCase(), valor: t }]).then(() => registrarLog("FIADO", `${cl}: R$ ${t.toFixed(2)}`)).then(() => supabaseClient.from('pedidos').delete().eq('mesa', idMesaAberta)).then(() => { setIdMesaAberta(null); buscarDados(); }); }}} className="bg-orange-600 p-4 rounded-2xl font-black uppercase text-[10px] text-white">Fiado</button>
                                    <button onClick={registrarPagamento} className="bg-green-600 p-4 rounded-2xl font-black uppercase text-[10px] text-white">Pagar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SEÇÃO DE IMPRESSÃO (VISÍVEL NO CUPOM) */}
                    <div id="secao-impressao" className="print-only">
                        <center>
                            <h2 style={{margin: '0', fontSize: '18px'}}>TÔ ATOA CONVENIÊNCIA</h2>
                            <p style={{margin: '5px 0'}}>{new Date().toLocaleString('pt-BR')}</p>
                            <p style={{margin: '0'}}>--------------------------------</p>
                            <h3 style={{margin: '10px 0'}}>CONTA MESA: {idMesaAberta}</h3>
                            {mesas[idMesaAberta - 1]?.apelido && <p>CLIENTE: {mesas[idMesaAberta - 1].apelido}</p>}
                            <p style={{margin: '0'}}>--------------------------------</p>
                        </center>
                        <table style={{width: '100%', borderCollapse: 'collapse', marginTop: '10px'}}>
                            <thead>
                                <tr style={{borderBottom: '1px solid black'}}><th style={{textAlign: 'left'}}>ITEM</th><th style={{textAlign: 'right'}}>PREÇO</th></tr>
                            </thead>
                            <tbody>
                                {(mesas[idMesaAberta - 1]?.itens || []).map((it, idx) => (
                                    <tr key={idx}><td style={{padding: '5px 0', textTransform: 'uppercase'}}>{it.produto_nome}</td><td style={{textAlign: 'right'}}>R$ {Number(it.preco_unidade).toFixed(2)}</td></tr>
                                ))}
                            </tbody>
                        </table>
                        <p style={{margin: '5px 0'}}>--------------------------------</p>
                        <div style={{textAlign: 'right', fontSize: '16px', fontWeight: 'bold'}}>TOTAL: R$ {(mesas[idMesaAberta - 1]?.total || 0).toFixed(2)}</div>
                        <center style={{marginTop: '20px'}}><p>Operador: {userLogado?.usuario}</p><p>OBRIGADO PELA PREFERÊNCIA!</p><br/>.</center>
                    </div>

                    {/* MODAL EDITAR PRODUTO */}
                    {produtoEditando && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-sm z-[70] flex items-center justify-center p-6">
                            <form onSubmit={async (e) => {
                                e.preventDefault();
                                const nome = e.target.n.value.toUpperCase();
                                await supabaseClient.from('produtos').update({ nome, preco: e.target.p.value, estoque: e.target.e.value, categoria: e.target.c.value }).eq('id', produtoEditando.id);
                                registrarLog("EDIÇÃO", `Editou produto: ${nome}`);
                                setProdutoEditando(null); buscarDados();
                            }} className="bg-slate-900 w-full max-w-sm rounded-[30px] p-6 border border-slate-800 space-y-4 shadow-2xl">
                                <h3 className="text-sm font-black uppercase text-orange-500 italic">Editar Produto</h3>
                                <input name="n" defaultValue={produtoEditando.nome} className="w-full bg-slate-800 p-3 rounded-xl outline-none font-bold text-white uppercase text-sm border border-slate-700" />
                                <div className="grid grid-cols-2 gap-2">
                                    <input name="p" step="0.01" type="number" defaultValue={produtoEditando.preco} className="bg-slate-800 p-3 rounded-xl text-white font-bold border border-slate-700" />
                                    <input name="e" type="number" defaultValue={produtoEditando.estoque} className="bg-slate-800 p-3 rounded-xl text-white font-bold border border-slate-700" />
                                </div>
                                <select name="c" defaultValue={produtoEditando.categoria} className="w-full bg-slate-800 p-3 rounded-xl text-white font-bold uppercase border border-slate-700">
                                    {categoriasAtendimento.filter(c => c.id !== 'Todos').map(c => <option key={c.id} value={c.nome}>{c.nome}</option>)}
                                </select>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setProdutoEditando(null)} className="flex-1 bg-slate-800 p-3.5 rounded-xl text-slate-500 font-bold uppercase text-xs">Cancelar</button>
                                    <button className="flex-1 bg-orange-600 p-3.5 rounded-xl font-black uppercase text-xs shadow-lg shadow-orange-950/40">Salvar</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render((<App />));
    </script>
</body>
</html>
